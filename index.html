<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Fin de Mes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314110f'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='%23d9a441' font-family='Georgia,serif'>$</text></svg>">
<style>
:root{
  --bg:#14110f; --card:#1c1815; --card2:#221d19; --line:#302925;
  --text:#ece5dd; --muted:#8f857a; --dim:#645b52;
  --oro:#d9a441; --verde:#6fbf8b; --rojo:#e2726e; --azul:#7ba6d9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px; margin:0 auto; padding:0 18px 60px}
.serif{font-family:Georgia,"Times New Roman",serif}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:0; z-index:20; background:rgba(20,17,15,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:10px 0 9px; margin-bottom:22px;
}
.progreso-fila{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.progreso{flex:1; height:2px; background:var(--line); border-radius:2px; overflow:hidden}
.progreso-fill{height:100%; background:var(--muted); transition:width .4s ease}
.anio-de{flex:0 0 auto; font-size:10.5px; color:var(--dim); letter-spacing:.03em}
/* Los dos números que deciden la partida, explicados donde están, y solo los
   primeros meses: después estorban. */
.leyenda{margin-top:10px; font-size:11.5px; line-height:1.5; color:var(--dim)}
.leyenda b{color:var(--muted); font-weight:600}
.hud-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:9px}
.edad{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fecha{font-size:12.5px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.edad{font-size:12.5px; color:var(--dim)}
.chips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:5px 9px; font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.chip b{font-weight:600; margin-left:4px}
.chip .lbl{color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em}
.chip.mala b{color:var(--rojo)} .chip.buena b{color:var(--verde)} .chip.oro b{color:var(--oro)}

/* ---------- barra de ánimo ---------- */
.animo-fila{display:flex; align-items:center; gap:8px; margin-top:9px}
.animo-lbl{font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; flex:0 0 auto}
.animo-bar{flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden}
.animo-fill{height:100%; transition:width .5s ease, background .5s ease}

/* ---------- tarjetas ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px}
.card.tenue{background:var(--card2); border-style:dashed}
.eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--oro); margin-bottom:10px}
.eyebrow.gris{color:var(--dim)}
h1{font-size:30px; line-height:1.15; margin:0 0 14px; font-weight:600}
h2{font-size:19px; line-height:1.3; margin:0 0 12px; font-weight:600}
.texto{font-size:17px; line-height:1.62; color:#ddd4ca}
.texto p{margin:0 0 13px} .texto p:last-child{margin-bottom:0}
.texto em{color:var(--text); font-style:italic}

/* ---------- opciones ---------- */
.ops{display:flex; flex-direction:column; gap:10px; margin-top:6px}
.op{
  width:100%; text-align:left; background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:12px; padding:15px 16px;
  font-family:inherit; font-size:15.5px; line-height:1.45; cursor:pointer;
  transition:border-color .15s, background .15s, transform .08s;
}
.op:hover{border-color:#4a4038; background:var(--card2)}
.op:active{transform:scale(.988)}
.op .sub{display:block; margin-top:5px; font-size:13px; color:var(--muted); line-height:1.4}
/* Los ejes que toca cada opción. Chicos y sin color fuerte: son para barrer con
   el ojo antes de leer, no para competir con el texto. */
.etiqs{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.etiq{font-size:10.5px; letter-spacing:.02em; padding:2.5px 7px; border-radius:5px;
  background:rgba(255,255,255,.05); color:var(--dim); white-space:nowrap}
.etiq.eg{color:#d99a92}
.etiq.in{color:#8fc99b}
.etiq.an{color:#d9bd7a}
.etiq.az{color:var(--dim); font-style:italic}
/* Cierre de mes compacto. El triangulito nativo se saca porque desentona con
   el resto; el estado abierto/cerrado se lee igual al tocar. */
.mes-plegado summary{list-style:none; cursor:pointer; display:flex; flex-wrap:wrap;
  align-items:baseline; gap:4px 10px}
.mes-plegado summary::-webkit-details-marker{display:none}
.mes-plegado summary .eyebrow{margin-bottom:0}
.mes-resumen{font-size:13px; color:var(--muted)}
.mes-resumen b{font-weight:600}
.mes-plegado[open] summary{margin-bottom:10px}
.op[disabled]{opacity:.42; cursor:not-allowed}
.op[disabled]:hover{border-color:var(--line); background:var(--card)}
/* La opción elegida se queda en pantalla como encabezado de lo que pasó. */
.op.elegida{opacity:1; border-color:rgba(217,164,65,.42); background:var(--card2); cursor:default}
.op.elegida:hover{border-color:rgba(217,164,65,.42); background:var(--card2)}
.op.elegida::before{content:"Elegiste"; display:block; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--oro); margin-bottom:6px}

/* ---------- consecuencia ---------- */
.conseq{border-left:2px solid var(--oro); padding-left:15px; margin:14px 0 18px; font-size:16px; line-height:1.6; color:#ddd4ca}
.conseq p{margin:0 0 10px} .conseq p:last-child{margin-bottom:0}

/* ---------- cierre de mes ---------- */
.mes-linea{display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-size:13.5px; padding:5px 0; font-variant-numeric:tabular-nums}
.mes-linea span:first-child{color:var(--muted); flex:0 0 auto; white-space:nowrap}
.mes-linea.total{border-top:1px solid var(--line); margin-top:6px; padding-top:9px; font-weight:600}
.pos{color:var(--verde)} .neg{color:var(--rojo)}
.aviso{font-size:13.5px; color:var(--oro); background:rgba(217,164,65,.07); border-radius:8px; padding:9px 12px; margin-top:10px; line-height:1.45}

/* ---------- botones ---------- */
.btn{
  display:block; width:100%; background:var(--text); color:var(--bg); border:none;
  border-radius:12px; padding:15px; font-family:inherit; font-size:15.5px; font-weight:600;
  cursor:pointer; transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn.ghost{background:none; color:var(--muted); border:1px solid var(--line); font-weight:500}
.btn.ghost:hover{color:var(--text); border-color:#4a4038}

/* ---------- arquetipo del final ---------- */
.arq{border:1px solid rgba(217,164,65,.34); background:rgba(217,164,65,.05);
  border-radius:14px; padding:18px; margin:20px 0 4px}
.arq-cab{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  margin-bottom:7px}
.arq-n{font-family:Georgia,serif; font-size:25px; line-height:1.15; color:var(--oro);
  margin-bottom:9px}
.arq-d{font-size:15px; line-height:1.55; color:#ddd4ca}
.arq-btn{margin-top:14px; background:none; border:1px solid var(--line); color:var(--muted);
  border-radius:9px; padding:9px 13px; font-family:inherit; font-size:12.5px; cursor:pointer;
  text-align:left; max-width:100%; word-break:break-word}
.arq-btn:hover{border-color:var(--oro); color:var(--oro)}
.arq-btn.listo{border-color:var(--verde); color:var(--verde)}

/* ---------- final ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0}
.stat{background:var(--card2); border-radius:10px; padding:13px}
.stat .n{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.stat .l{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.3}
.comp{display:flex; align-items:center; gap:10px; padding:9px 0; font-size:14px; border-bottom:1px solid var(--line)}
.comp:last-child{border-bottom:none}
.comp .nom{flex:1} .comp .val{font-variant-numeric:tabular-nums; font-weight:600}
.comp .barra{height:5px; background:var(--line); border-radius:3px; width:78px; overflow:hidden}
.comp .barra i{display:block; height:100%; background:var(--dim)}
.comp.yo .nom{color:var(--oro); font-weight:600} .comp.yo .barra i{background:var(--oro)}

/* ---------- gráfico del patrimonio ---------- */
/* La banda de arriba está reservada para el globo: si se dibujara encima de la
   curva taparía justo el punto que estás mirando. */
.graf{position:relative; margin:4px 0 10px; padding-top:40px; touch-action:pan-y}
.graf svg{display:block; width:100%; height:132px; overflow:visible}
.graf .graf-cruz{opacity:0; transition:opacity .12s}
.graf.activo .graf-cruz{opacity:1}
.graf-tip{
  position:absolute; top:0; transform:translateX(-50%); pointer-events:none;
  background:var(--card2); border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; font-size:12px; line-height:1.35; color:var(--muted);
  white-space:nowrap; opacity:0; transition:opacity .12s;
}
.graf.activo .graf-tip{opacity:1}
.graf-tip{display:flex; align-items:baseline; gap:7px}
.graf-tip b{color:var(--oro); font-size:13.5px; font-variant-numeric:tabular-nums}
.graf-pie{display:flex; justify-content:space-between; gap:10px; margin-top:7px;
  font-size:11.5px; color:var(--dim)}
.graf-pie span:nth-child(2){color:var(--muted)}
.graf-cap{font-size:13px; line-height:1.5; color:var(--muted); margin:0 0 22px}

/* ---------- conceptos y logros ---------- */
.concepto{padding:16px 18px}
.concepto-n{font-family:Georgia,serif; font-size:17px; color:var(--oro); margin-bottom:7px}
.concepto-t{font-size:15px; line-height:1.58; color:#ddd4ca}
.pendientes{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
.pendiente{font-size:12.5px; color:var(--dim); border:1px dashed var(--line);
  border-radius:7px; padding:5px 9px}
.logro{display:flex; gap:11px; align-items:baseline; padding:8px 0; font-size:14.5px;
  border-bottom:1px solid var(--line)}
.logro:last-child{border-bottom:none}
.logro-tic{color:var(--oro); font-size:11px; flex:0 0 auto}
.logro-d{display:block; font-size:13px; color:var(--muted); margin-top:2px}
.nuevo{display:inline-block; margin-left:7px; font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--verde); border:1px solid var(--verde);
  border-radius:4px; padding:1px 5px; vertical-align:middle; font-weight:600}

/* ---------- revisión anual de cartera ---------- */
.rubro{padding:12px 0; border-bottom:1px solid var(--line)}
.rubro:last-of-type{border-bottom:none}
.rubro-cab{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px}
.rubro-n{font-size:14.5px}
.rubro-v{font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.rubro-hoy{color:var(--dim); font-size:11.5px}
.rubro-ren{display:inline-block; margin-left:7px; font-size:11.5px;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.rubro-ren.pos{color:var(--verde)} .rubro-ren.neg{color:var(--rojo)}
.rubro-ctrl{display:flex; align-items:center; gap:12px}
.rubro-pct{font-size:13.5px; font-variant-numeric:tabular-nums; width:40px; text-align:right;
  flex:0 0 auto; color:var(--oro)}
.rubro-monto{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:5px}

/* Perillas. Los navegadores no comparten una sola forma de estilar un range, así
   que va el pseudo-elemento de WebKit y el de Firefox por separado. El área
   táctil se agranda con padding para que se pueda arrastrar con el dedo. */
.perilla{
  flex:1; -webkit-appearance:none; appearance:none; background:transparent;
  height:26px; margin:0; padding:0; cursor:pointer; min-width:0;
}
/* El relleno va por variable CSS porque WebKit no tiene un pseudo-elemento de
   progreso como Firefox: sin esto la barra queda gris entera y no se ve cuánto
   pusiste. La variable la escribe refrescarCartera() al mover. */
.perilla::-webkit-slider-runnable-track{
  height:6px; border-radius:3px;
  background:linear-gradient(to right, var(--oro) var(--fill,0%), var(--line) var(--fill,0%));
}
.perilla::-moz-range-track{ height:6px; border-radius:3px; background:var(--line); }
.perilla::-moz-range-progress{ height:6px; border-radius:3px; background:var(--oro); }
.perilla::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--oro); border:3px solid var(--card); margin-top:-7px;
  box-shadow:0 0 0 1px var(--line);
}
.perilla::-moz-range-thumb{
  width:20px; height:20px; border-radius:50%; background:var(--oro);
  border:3px solid var(--card); box-shadow:0 0 0 1px var(--line);
}
.perilla:focus-visible{ outline:2px solid var(--oro); outline-offset:4px; border-radius:6px; }
/* ---------- saldo sin asignar ---------- */
.saldo{margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
  font-size:13.5px; text-align:right; font-variant-numeric:tabular-nums}
.saldo.cero{color:var(--verde)}
.saldo.hay{color:var(--oro)}
.saldo b{font-size:15px}
.saldo-plata{color:var(--muted); margin-left:6px}
.rubro-total{margin-top:14px; padding-top:11px; border-top:1px solid var(--line);
  font-size:13px; text-align:right}
.rubro-total.ok{color:var(--verde)} .rubro-total.mal{color:var(--oro)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.op.tenue-op{color:var(--muted); border-style:dashed}
.campo{width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:15px 16px; font-family:inherit; font-size:16px; color:var(--text)}
.campo::placeholder{color:var(--dim)}
.campo:focus{outline:none; border-color:var(--oro)}
.dif{float:right; font-size:9px; letter-spacing:2px; color:var(--oro); line-height:2}
.dif-off{color:var(--line)}

/* ---------- veredicto del pronóstico ---------- */
.veredicto{border-radius:12px; padding:14px 16px; margin:0 0 16px; border:1px solid var(--line)}
.veredicto.bien{background:rgba(111,191,139,.07); border-color:rgba(111,191,139,.32)}
.veredicto.mal{background:rgba(226,114,110,.06); border-color:rgba(226,114,110,.28)}
.veredicto-cab{font-size:11px; letter-spacing:.09em; text-transform:uppercase; margin-bottom:6px}
.veredicto.bien .veredicto-cab{color:var(--verde)}
.veredicto.mal .veredicto-cab{color:var(--rojo)}
.veredicto-cpo{font-size:14.5px; line-height:1.55; color:#ddd4ca}

/* ---------- aviso de desbloqueo ---------- */
.desbloqueo{display:flex; gap:11px; align-items:flex-start; background:var(--card2);
  border:1px solid var(--line); border-left:2px solid var(--oro); border-radius:10px;
  padding:13px 15px; margin-bottom:12px}
.desbloqueo .ico{color:var(--oro); font-size:12px; flex:0 0 auto; line-height:1.5}
.desbloqueo.nuevo-instr{border-left-color:var(--verde)}
.desbloqueo.nuevo-instr .ico, .desbloqueo.nuevo-instr .ttl{color:var(--verde)}
.desbloqueo .cab{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); margin-bottom:5px}
.desbloqueo .ttl{font-family:Georgia,serif; font-size:16px; color:var(--oro); margin-bottom:5px}
.desbloqueo .cpo{font-size:14.5px; line-height:1.55; color:#ddd4ca}

.fade{animation:fade .32s ease}
@media (prefers-reduced-motion:reduce){ .fade{animation:none} }
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.nota{font-size:12.5px; color:var(--dim); line-height:1.5; margin-top:20px}
/* Las reglas del juego, en la pantalla inicial. Van en una tarjeta aparte y no
   en el texto de arriba para que se lean como instrucciones y no como clima. */
.comovaeso{border:1px solid var(--line); border-radius:12px; padding:15px 16px 14px;
  margin-bottom:22px; background:rgba(255,255,255,.018)}
.comovaeso .cv-t{font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--oro); margin-bottom:9px}
.comovaeso p{font-size:13.5px; line-height:1.55; color:var(--txt); margin:0 0 8px}
.comovaeso p:last-child{margin-bottom:0}
.comovaeso .cv-aire{color:var(--verde)}
.comovaeso .cv-animo{color:var(--oro)}
.comovaeso .cv-fin{color:var(--dim); font-size:12.5px; margin-top:10px}
hr.sep{border:none; border-top:1px solid var(--line); margin:22px 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="hud"></div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ==========================================================================
   FIN DE MES — juego narrativo de decisiones. Una vida argentina, mes a mes.
   Todo el estado vive en memoria; solo se persiste la partida en curso.
   ========================================================================== */

const CLAVE = "finDeMes.partida.v1";
const MESES_NOMBRE = ["enero","febrero","marzo","abril","mayo","junio",
                      "julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DURACION = 120;            // 10 años
const MES_INICIAL = 2;           // arranca en marzo
const ANIO_INICIAL = 2026;

/* ---------- utilidades ---------- */
const fmt   = n => "$" + Math.round(n).toLocaleString("es-AR");
const fmtK  = n => Math.abs(n) >= 1e6 ? "$" + (n/1e6).toFixed(1).replace(".",",") + "M" : fmt(n);
const usd   = n => "US$" + Math.round(n).toLocaleString("es-AR");
const pct   = n => (n*100).toFixed(1).replace(".",",") + "%";
const rnd   = (a,b) => a + Math.random()*(b-a);
const rndI  = (a,b) => Math.floor(rnd(a,b+1));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ==========================================================================
   MACROECONOMÍA
   El régimen está oculto. El jugador solo ve inflación del mes y precio del
   dólar. Cada 24-40 meses se re-sortea: nadie aprende "el" régimen de memoria.
   ========================================================================== */
/* Cada régimen define inflación, cuánto se atrasa el dólar, con qué frecuencia
   salta, qué tan mal le va a la paritaria y el riesgo de quedarse sin laburo.
   `dura` son los meses que puede durar; `sale` a dónde puede derivar después.
   La crisis es corta y siempre desemboca en otra cosa: nadie vive diez años en
   crisis, y si el juego lo permitiera los números se irían a la hiperinflación. */
const REGIMENES = {
  estable: { infl:[.004,.016], dura:[18,40], atraso:[.02,.14],  pSalto:.010, salto:[.05,.12],
             tasaPF:[1.02,1.35], parit:[.85,1.15], pDespido:.005, sale:["alta","volatil"] },
  alta:    { infl:[.022,.045], dura:[16,32], atraso:[.06,.22],  pSalto:.045, salto:[.10,.22],
             tasaPF:[.88,1.12],  parit:[.68,1.00], pDespido:.010, sale:["estable","volatil","crisis"] },
  volatil: { infl:[.015,.038], dura:[12,24], atraso:[-.06,.16], pSalto:.075, salto:[.14,.30],
             tasaPF:[.82,1.18],  parit:[.65,1.02], pDespido:.013, sale:["alta","estable","crisis"] },
  crisis:  { infl:[.045,.085], dura:[5,12],  atraso:[-.26,-.04], pSalto:.10,  salto:[.18,.38],
             tasaPF:[.62,.92],   parit:[.55,.85], pDespido:.028, sale:["alta","estable"] },
};
const NOMBRES_REG = Object.keys(REGIMENES);
const DOLAR_BASE = 1350;   // referencia para medir el atraso cambiario

/* ==========================================================================
   LA ESCALERA
   Los instrumentos no están todos disponibles desde el minuto uno: se van
   habilitando según cuánto aire tengas. No es una traba artificial — es la
   regla que más plata le ahorra a la gente y que nadie respeta: primero el
   colchón, después invertir. Querer comprar bonos sin tener para el mes que
   viene no es ser audaz, es no haber entendido el orden.
   ========================================================================== */
const ESCALERA = [
  { id:"plazo",  aire:.5, n:"Plazo fijo",
    d:"Le prestás plata al banco por treinta días. A veces le gana a la inflación, a veces no, pero pierde mucho menos que quedarte quieto." },
  { id:"dolar",  aire:1.5, n:"Dólares",

/* ---------- valuaciones ---------- */
// El bono y el índice cotizan en dólares; acá se pasan a pesos para sumarlos.
const valorBono   = () => S.bonoVN * (S.bonoPrecio / 100) * S.dolar;
const valorIndice = () => S.indiceUn * S.indicePrecio * S.dolar;
const tieneAcceso = id => !!S.instrumentos[id];

let S = null;   // estado de la partida

    gente: { pedro:{ etapa:"", visto:-99 }, vale:{ etapa:"", visto:-99 },

       dentro de su ventana, y cuáles ocurren y cuáles no. Antes todos los hitos

/* Escenas que tienen que estar disponibles en toda vida: las que sostienen el
   ritmo del juego (quedarte sin laburo, el bajón, las elecciones) y los arcos de
   los personajes, que se romperían si faltara un capítulo del medio. */
/* Las escenas de camino van acá porque ya están filtradas por su `cond`: solo
   aparecen si elegiste ese arranque. Si además entraran en el sorteo del
   catálogo, un tercio de las veces elegir "monotributista" no te daría ninguna
   escena propia y la decisión inicial no significaría nada. */
const SIEMPRE = new Set(["bajon","volver-a-laburar","eleccion","pre-eleccion","emergencia",
  "cobro-90","reponer","contratado","volver-al-pueblo","companero-se-va","suegros",
  "vivir-solo","solo-sin-red"]);

/* Los arcos se sortean enteros, no escena por escena: o esa persona está en tu
   vida o no está. Si Pedro no aparece nunca, esa partida se siente distinta de
   verdad — y si apareciera solo el capítulo tres, se sentiría rota. */
const ARCOS = {
  pedro:    { escenas:["pedro-1","pedro-2","pedro-3","pedro-4"], prob:.78 },
  vale:     { escenas:["vale-1","vale-2","vale-3"],              prob:.78 },
  bautista: { escenas:["prestamo-amigo","bautista-2"],           prob:.78 },
};

/* Decide, una vez por partida, cuándo cae cada hito, cuáles ocurren, y qué
   parte del catálogo de eventos existe en esta vida.

   Sin ese último sorteo dos partidas compartían el 66% de las escenas: con 59
   escenas y unas 60 pantallas por partida, veías el catálogo entero siempre. No
   es que faltara contenido — es que no había nada que quedara afuera. */
function sortearGuion(){
  S.guion = {};
  HITOS.forEach(h => {
    const v = h.ventana || 0;
    S.guion[h.id] = {
      mes: Math.max(1, h.mes + (v ? rndI(-v, v) : 0)),
      ocurre: h.prob == null || Math.random() < h.prob,
    };
  });
  S.guion.eventos = {};
  EVENTOS.forEach(e => {
    S.guion.eventos[e.id] = SIEMPRE.has(e.id) || Math.random() < .68;
  });
  // Y encima de eso, quién aparece en tu vida y quién no.
  Object.values(ARCOS).forEach(a => {
    const hay = Math.random() < a.prob;
    a.escenas.forEach(id => S.guion.eventos[id] = hay);
  });
}

/* ==========================================================================
   PERSONAJES
   Antes cada escena traía "un amigo" distinto y las repeticiones se sentían
   repeticiones. Ahora vuelven cuatro personas con nombre y arco propio:

     Pedro     el que siempre tiene el dato. Eufórico, después deja el laburo
               para operar, después se funde. Su historia avanza sola, la
               acompañes o no — la lección es que el que te muestra la pantalla
               en verde nunca te muestra la de seis meses después.
     Vale      compañera de trabajo que sabe de plata. Te explica, después se va
               a otra empresa por más guita, después te ofrece entrar donde está.
     Bautista  el que arranca cosas. Te pide prestado, después te ofrece entrar
               en su negocio, después el negocio se define.
     Susana    tu vieja. Aparece en el primer sueldo, cuando no le cierra el mes
               y cuando internan a tu viejo.

   `etapa` es dónde está su historia; `visto`, el mes de la última aparición.
   Las continuaciones esperan al menos año y medio para que se sientan años. */
const ESPERA_ARCO = 18;
const avanzaArco = (id, etapa) => { S.gente[id].etapa = etapa; S.gente[id].visto = S.mes; };
const enArco = (id, etapa) => S.gente[id].etapa === etapa
                           && S.mes - S.gente[id].visto >= ESPERA_ARCO;

/* Cuál de los instrumentos abiertos rindió más en el año que cierra. */
function ganadorDelAnio(){
  const r = rendimientoAnual();
  if(!r) return null;
  const abiertos = rubrosAbiertos().map(x => x.id);
  return abiertos.reduce((a, b) => (r[b] > r[a] ? b : a), abiertos[0]);
}

/* Foto de los mercados para poder comparar dentro de doce meses. */
const fotoMercados = () => ({ ipc: S.ipc, dolar: S.dolar,
  idxPlazo: S.idxPlazo, idxBono: S.idxBono, indice: S.indicePrecio });

/* Rendimiento real del último año por instrumento: cuánto se movió cada cosa
   descontada la inflación. Es la resta, que es el único número que importa. */
function rendimientoAnual(){
  if(!S.snap) return null;
  const f = S.snap, infl = S.ipc / f.ipc;
  const real = x => x / infl - 1;
  return {
    pesos:  real(1),
    plazo:  real(S.idxPlazo / f.idxPlazo),
    dolar:  real(S.dolar / f.dolar),
    bono:   real(S.idxBono / f.idxBono * (S.dolar / f.dolar)),
    indice: real(S.indicePrecio / f.indice * (S.dolar / f.dolar)),
  };
}

/* Una escena repetible puede traer varias versiones del texto. Que el súper o la
   heladera vuelvan dos veces en diez años es correcto — así es la vida. Lo que
   rompe todo es leer el mismo párrafo de nuevo. Con variantes, la segunda vez
   puede además saber que es la segunda vez, y ahí la repetición deja de ser un
   bache y pasa a ser continuidad. */
function textoDe(esc){
  const n = Math.max(0, (S.vistas[esc.id] || 1) - 1);
  let t = esc.texto;
  /* Si `texto` es un objeto, elige por cómo te ganás la vida, y adentro puede
     tener su propia lista de variantes. Un bono de fin de año no le pasa a un
     monotributista: le pasa que un cliente le paga tres facturas juntas. Es la
     misma escena y la misma decisión — cambia de dónde salió la plata, que es
     lo que hace que la situación tenga que ver con la vida que elegiste. */
  if(t && !Array.isArray(t) && typeof t !== "function") t = t[S.trabajoTipo] || t.otro;
  return Array.isArray(t) ? t[Math.min(n, t.length - 1)]() : t();
}

/* Cuánto rinde el título según cómo llegaste a él: el que priorizó cursar
   entra mejor, el que cambió facultad por changas mejor pagas entra peor y dos
   años más tarde. La decisión es del mes 14; la factura llega en el 52. */
const saltoTitulo = () => S.flags.enfocado ? 1.12 : S.flags.menosFacu ? .88 : 1;

/* ==========================================================================
   QUÉ TE VA A COSTAR ESTA OPCIÓN
   Un jugador de verdad tardaba muchísimo en cada pantalla. No porque la
   decisión fuera difícil, sino porque no había con qué decidir: el juego le
   avisaba que no hay respuestas correctas y no le decía qué mueve cada opción.
   Eso no es una decisión, es una adivinanza.

   Las etiquetas se leen del código de la propia opción, no de una lista escrita
   a mano: 216 opciones anotadas a mano se desincronizan del código en la
   primera semana. Muestran los ejes que toca —plata, ánimo, gasto fijo, azar—
   nunca cuánto ni si conviene. Lo que se decide sigue estando entero: qué te
   importa más, y qué va a pasar después.
   ========================================================================== */
const cacheEtiq = new WeakMap();
function etiquetasOpcion(o){
  if(cacheEtiq.has(o)) return cacheEtiq.get(o);
  const s = String(o.hacer);
  const hay = rx => rx.test(s);
  const t = [];

  const azar    = hay(/Math\.random\(\)/);
  const animoUp = hay(/animo\(\s*(?!-)[\d.]/);
  const animoDn = hay(/animo\(\s*-/);

  const sale  = hay(/\bgastar\(|S\.pesos\s*-=/);
  const entra = hay(/\bcobrar\(|S\.pesos\s*\+=/);
  /* Poner plata esperando recuperarla no es un gasto ni un ingreso: es una
     apuesta. Mostrar las dos flechas juntas confundía más que no decir nada. */
  if(sale && entra && azar) t.push({ t:"arriesgás plata", c:"az" });
  else {
    if(sale)  t.push({ t:"cuesta plata", c:"eg" });
    if(entra) t.push({ t:"entra plata",  c:"in" });
  }
  /* Comprar dólares no te saca plata, la cambia de moneda. */
  if(hay(/comprarUsd\(/)) t.push({ t:"pasás a dólares", c:"nu" });
  if(hay(/S\.cuotas\.push/))                             t.push({ t:"en cuotas",    c:"eg" });
  if(hay(/S\.deuda\s*\+=/))                              t.push({ t:"te endeudás",  c:"eg" });
  if(hay(/S\.gastos\s*\*=\s*1\./))                       t.push({ t:"sube tu gasto fijo", c:"eg" });
  if(hay(/S\.gastos\s*\*=\s*\./))                        t.push({ t:"baja tu gasto fijo", c:"in" });
  if(hay(/S\.sueldo\s*\*=/))                             t.push({ t:"cambia lo que entra", c:"nu" });

  /* Si el ánimo sube en una rama y baja en otra, el signo lo decide el azar y
     prometer una flecha sería mentir. */
  if(animoUp && animoDn) t.push({ t:"ánimo, según cómo salga", c:"nu" });
  else if(animoUp)       t.push({ t:"ánimo ↑", c:"an" });
  else if(animoDn)       t.push({ t:"ánimo ↓", c:"eg" });

  if(azar) t.push({ t:"puede salir mal", c:"az" });

  cacheEtiq.set(o, t);
  return t;
}
const etiquetasHtml = o => {
  const t = etiquetasOpcion(o);
  return t.length ? `<span class="etiqs">${t.map(x =>
    `<span class="etiq ${x.c}">${x.t}</span>`).join("")}</span>` : "";
};

/* ---------- lecturas derivadas ---------- */
const fechaMes  = () => (MES_INICIAL + S.mes) % 12;
const fechaAnio = () => ANIO_INICIAL + Math.floor((MES_INICIAL + S.mes) / 12);
const patrimonio = () => S.pesos + S.usd * S.dolar + S.plazo
                       + valorBono() + valorIndice() - S.deuda;
const cuotasMes  = () => S.cuotas.reduce((a,c) => a + c.monto, 0);
const egresoFijo = () => S.gastos + cuotasMes();
const aire       = () => egresoFijo() > 0 ? patrimonio() / egresoFijo() : 0;
/* El aire que abre escalones cuenta solo lo que podés usar mañana. Un bono no
   te salva el martes que se rompe la heladera: eso es liquidez, no patrimonio. */
const aireLiquido = () => egresoFijo() > 0
  ? (S.pesos + S.usd * S.dolar + S.plazo - S.deuda) / egresoFijo() : 0;
/* La tasa a veces le gana a la inflación y a veces no, según el momento.
   Igual que el dólar: ninguna opción es siempre la ganadora. */
/* Más de cinco años de aire ya no cambia nada en la práctica: el número deja de
   ser informativo y solo infla el ego. Se muestra tope. */
const aireTexto = a => a <= 0 ? "0" : a > 60 ? "60+" : a.toFixed(1).replace(".", ",");
const tasaPF     = () => S.inflMes * rnd(REGIMENES[S.regimen].tasaPF[0], REGIMENES[S.regimen].tasaPF[1]);
const tasaDeuda  = () => S.inflMes + rnd(.030,.055);        // la tarjeta siempre gana
/* Nadie te presta infinito. El límite es lo que un banco de verdad te daría. */
const deudaTotal = () => S.deuda + S.cuotas.reduce((a,c) => a + c.monto * c.restantes, 0);
const limiteCredito = () => (S.trabajo ? S.sueldo * 2.5 : S.gastos * 1.5);

/* ---------- mutadores usados por las escenas ---------- */
function cobrar(n, desc){
  S.pesos += n; S.inMes += n;
  if(desc) S.detalle.push([desc, n]);
}
/** Gasta n. Si no alcanza la plata, el resto cae en la tarjeta — hasta el límite.
    Pasado el límite no hay más crédito: ahí no queda otra que achicarse, que es
    lo que pasa en la vida real cuando se te cierran las puertas. */
function gastar(n, desc){
  S.egMes += n;
  if(desc) S.detalle.push([desc, -n]);
  const disp = Math.max(0, S.pesos);
  if(disp >= n){ S.pesos -= n; return 0; }

  let falta = n - disp;
  S.pesos = 0;
  const margen = Math.max(0, limiteCredito() - S.deuda);
  const aTarjeta = Math.min(falta, margen);
  if(aTarjeta > 0){
    S.deuda += aTarjeta;
    S.avisos.push("No te alcanzaba: " + fmt(aTarjeta) + " quedaron en la tarjeta.");
  }
  const sinCubrir = falta - aTarjeta;
  if(sinCubrir > 0){
    // Se te acabó el crédito. Recortás para poder seguir — hasta donde se puede.
    S.gastos = Math.max(S.gastos * .93, S.gastosPiso);
    animo(-5);
    S.flags.sinCredito = true;
    S.avisos.push("Se te cortó el crédito. Tuviste que recortar el mes para poder cubrirlo.");
  }
  return falta;
}
function animo(n){ S.animo = clamp(S.animo + n, 0, 100); }
function comprarUsd(montoPesos){
  const efectivo = Math.min(montoPesos, Math.max(0, S.pesos));
  if(efectivo <= 0) return 0;
  const c = efectivo / (S.dolar * 1.02);        // spread de compra
  S.pesos -= efectivo; S.usd += c;
  return c;
}
function venderUsd(cant){
  const c = Math.min(cant, S.usd);
  if(c <= 0) return 0;
  const p = c * S.dolar * 0.98;                 // spread de venta
  S.usd -= c; S.pesos += p;
  return p;
}
/* Comprar y vender bonos e índice. Todo pasa por pesos y todo paga comisión:
   mover plata nunca es gratis, y esa es media razón por la que reacomodar la
   cartera todos los meses es peor negocio que dejarla quieta. */
const COMISION = .008;

function comprarBono(montoPesos){
  const m = Math.min(montoPesos, Math.max(0, S.pesos));
  if(m <= 0 || S.bonoPrecio <= 0) return 0;
  S.pesos -= m;
  const vn = (m * (1 - COMISION)) / S.dolar / (S.bonoPrecio / 100);
  S.bonoVN += vn;
  return vn;
}
function venderBono(vn){
  const v = Math.min(vn, S.bonoVN);
  if(v <= 0) return 0;
  const p = v * (S.bonoPrecio / 100) * S.dolar * (1 - COMISION);
  S.bonoVN -= v; S.pesos += p;
  return p;
}
function comprarIndice(montoPesos){
  const m = Math.min(montoPesos, Math.max(0, S.pesos));
  if(m <= 0) return 0;
  S.pesos -= m;
  const un = (m * (1 - COMISION)) / S.dolar / S.indicePrecio;
  S.indiceUn += un;
  return un;
}
function venderIndice(un){
  const u = Math.min(un, S.indiceUn);
  if(u <= 0) return 0;
  const p = u * S.indicePrecio * S.dolar * (1 - COMISION);
  S.indiceUn -= u; S.pesos += p;
  return p;
}

function ponerPlazo(monto){
  const m = Math.min(monto, Math.max(0, S.pesos));
  if(m <= 0) return 0;
  S.pesos -= m; S.plazo += m; S.plazoMeses = 1;
  return m;
}
function enCuotas(total, n, desc){
  S.cuotas.push({ monto: total / n, restantes: n, desc });
  S.egMes += 0;
}
function recordar(t){ S.historia.push({ mes: S.mes, t }); }

/* ==========================================================================
   CARTERA
   ========================================================================== */
const RUBROS = [
  { id:"pesos",  n:"Pesos en la cuenta", corto:"Pesos",   siempre:true },
  { id:"plazo",  n:"Plazo fijo",         corto:"Plazo"    },
  { id:"dolar",  n:"Dólares",            corto:"Dólares"  },
  { id:"bono",   n:"Bono del país",      corto:"Bono"     },
  { id:"indice", n:"Índice global",      corto:"Índice"   },
];
const rubrosAbiertos = () => RUBROS.filter(r => r.siempre || tieneAcceso(r.id));
const nombreRubro = id => (RUBROS.find(x => x.id === id) || {}).corto || id;

function valores(){
  return { pesos: Math.max(0, S.pesos), plazo: S.plazo,
           dolar: S.usd * S.dolar, bono: valorBono(), indice: valorIndice() };
}
const totalCartera = () => Object.values(valores()).reduce((a,b) => a + b, 0);

/* Mueve solo la diferencia entre lo que tenés y lo que querés tener. Vender todo
   y recomprar pagaría comisión sobre el total — que es, de paso, la razón por la
   que reacomodar la cartera seguido es peor negocio que dejarla quieta. */
function rebalancear(objetivo){
  const v = valores(), total = totalCartera();
  if(total <= 0) return 0;
  let movido = 0;
  const meta = k => total * (objetivo[k] || 0) / 100;

  for(const k of ["plazo","dolar","bono","indice"]){
    const exceso = v[k] - meta(k);
    if(exceso <= 1) continue;
    movido += exceso;
    if(k === "plazo"){ const x = Math.min(exceso, S.plazo); S.plazo -= x; S.pesos += x; }
    if(k === "dolar")  venderUsd(exceso / S.dolar);
    if(k === "bono")   venderBono(exceso / ((S.bonoPrecio / 100) * S.dolar));
    if(k === "indice") venderIndice(exceso / (S.indicePrecio * S.dolar));
  }
  for(const k of ["plazo","dolar","bono","indice"]){
    const falta = Math.min(meta(k) - v[k], Math.max(0, S.pesos));
    if(falta <= 1) continue;
    movido += falta;
    if(k === "plazo")  ponerPlazo(falta);
    if(k === "dolar")  comprarUsd(falta);
    if(k === "bono")   comprarBono(falta);
    if(k === "indice") comprarIndice(falta);
  }
  return movido;
}

/* ==========================================================================
   MERCADOS
   ========================================================================== */

/* Cuánto vale el bono según quién gobierna y cómo viene el país. La lógica que
   tiene que quedar clara jugando: el bono paga mucho porque puede no pagarte.
   No es plata gratis, es que te están pagando por bancarte el riesgo. */
const BONO_OBJETIVO = { estable: 94, alta: 70, volatil: 61, crisis: 30 };

/* La elección es el único momento del juego con fecha conocida. Lo que no se
   sabe es el resultado ni, sobre todo, cómo va a reaccionar el mercado.

   Decisión de diseño importante: el precio NO se mueve según quién ganó, sino
   según cuánto se apartó de lo que ya estaba descontado. Si el bono subiera
   siempre con un signo político, el juego enseñaría a apostarle a ese signo —
   que es falso y además convertiría esto en un panfleto. Acá la sorpresa manda,
   y por eso no se puede farmear el resultado. */
function resolverEleccion(){
  S.elecciones++;
  const desgaste = (S.regimen === "crisis" || S.regimen === "alta") ? .74 : .42;
  const cambia = Math.random() < desgaste;
  const anterior = S.gobierno;
  if(cambia) S.gobierno = anterior === "ajuste" ? "gasto" : "ajuste";

  S.regimen = S.gobierno === "ajuste"
    ? pick(["estable","estable","volatil","crisis"])
    : pick(["alta","alta","volatil","estable"]);
  S.mesesRegimen = rndI(REGIMENES[S.regimen].dura[0], REGIMENES[S.regimen].dura[1]);

  const tilt = S.gobierno === "ajuste" ? .16 : -.16;
  const sorpresa = tilt + rnd(-.55, .55);
  const antes = S.bonoPrecio;
  S.bonoPrecio = clamp(S.bonoPrecio * (1 + sorpresa), 8, 118);
  S.aEleccion = 48;

  return { cambia, gobierno: S.gobierno, anterior,
           antes, ahora: S.bonoPrecio,
           subioBono: S.bonoPrecio > antes };
}

function moverMercados(R){
  // La elección se resuelve sola; la escena que la cuenta llega enseguida.
  if(S.aEleccion <= 0 && !S.eleccionPendiente) S.eleccionPendiente = resolverEleccion();

  // --- bono del país ---
  if(!S.bonoDefault){
    let obj = BONO_OBJETIVO[S.regimen] * (S.gobierno === "ajuste" ? 1.10 : .92);
    // Antes de la elección nadie quiere quedarse con papeles: el precio se hunde.
    if(S.aEleccion <= 6 && S.aEleccion > 0) obj -= (7 - S.aEleccion) * 3.4;
    S.bonoPrecio = clamp(S.bonoPrecio + (obj - S.bonoPrecio) * .16 + rnd(-3.5, 3.5), 8, 118);

    if(S.bonoVN > 0){
      const cupon = S.bonoVN * .0053;             // ~6,5% anual en dólares
      S.usd += cupon; S.cuponTotal += cupon;
      if(S.mes % 6 === 0) S.avisos.push("Cobraste " + usd(cupon * 6) + " de cupones del bono.");
    }
    /* Default: la quita. Es lo que hace que el cupón no sea plata gratis. Pasa
       sobre todo en crisis, y también cuando el bono ya viene castigado — que es
       cuando de verdad se cae, no cuando está tranquilo.

       El precio se desploma lo tengas o no: el mercado no espera a ver si vos
       estás adentro. Antes esto vivía dentro del `if` de abajo, así que en las
       partidas donde no tenías bonos el default se declaraba pero la cotización
       seguía como si nada — y el precio quedaba sano para cuando comprabas. */
    const riesgoDefault = S.regimen === "crisis" ? .038
                        : (S.bonoPrecio < 45 ? .011 : .0015);
    if(Math.random() < riesgoDefault){
      S.bonoDefault = true;
      const quita = rnd(.55, .78);
      S.bonoPrecio = rnd(15, 26);
      if(S.bonoVN > 0){
        S.bonoVN *= (1 - quita);
        animo(-12); S.golpes++;
        aprender("default");
        S.avisos.push("El país entró en default. Te reestructuran el bono con una quita del "
          + Math.round(quita*100) + "% y dejan de pagar cupones.");
      } else {
        S.avisos.push("El país entró en default. El bono se desplomó; por suerte no tenías.");
      }
    }
  } else if(Math.random() < .022){
    // Se reestructura y vuelve a pagar. Tarde, peor, pero vuelve.
    S.bonoDefault = false; S.bonoPrecio = rnd(32, 46);
    S.avisos.push("Cerró el canje de deuda. El bono vuelve a pagar cupones, más chicos.");
  }

  /* El índice del bono suma el cupón al cambio de precio. Sin el cupón parecería
     que el bono solo pierde valor, que es exactamente la lectura equivocada. */
  const precioAntes = S.idxBonoPrecio || S.bonoPrecio;
  S.idxBono *= S.bonoDefault
    ? (S.bonoPrecio / precioAntes)
    : ((S.bonoPrecio / 100 + .0053) / (precioAntes / 100));
  S.idxBonoPrecio = S.bonoPrecio;

  // --- índice global ---
  let r;
  if(S.mesesCrash > 0){ r = rnd(-.115, -.005); S.mesesCrash--; }
  else if(Math.random() < .013){
    S.mesesCrash = rndI(2, 5); r = rnd(-.135, -.045);
    if(S.indiceUn > 0){
      aprender("volatilidad");
      S.avisos.push("Se cayeron los mercados del mundo. Tu índice global está en rojo fuerte.");
    }
  }
  else r = .0065 + rnd(-.032, .042);            // sube a la larga, con ruido
  S.indicePrecio = Math.max(12, S.indicePrecio * (1 + r));

  // --- la escalera: habilitar lo que el colchón ya te permite ---
  const aL = aireLiquido();
  for(const e of ESCALERA){
    if(S.instrumentos[e.id] || aL < e.aire) continue;
    S.instrumentos[e.id] = S.mes;
    S.nuevos.push({ tipo:"instrumento", id: e.id });
  }
}

/* ==========================================================================
   EL PASO DEL MES
   ========================================================================== */
function avanzarMes(){
  S.mes++;
  if((MES_INICIAL + S.mes) % 12 === 0) S.edad++;
  S.avisos = []; S.detalle = []; S.inMes = 0; S.egMes = 0;

  /* --- régimen ---
     Cambia solo, y la crisis nunca es permanente. Pero el cambio grande se lo
     lleva la elección: ver `resolverEleccion`. Acá solo pasa la deriva lenta. */
  if(--S.mesesRegimen <= 0){
    S.regimen = pick(REGIMENES[S.regimen].sale);
    S.mesesRegimen = rndI(REGIMENES[S.regimen].dura[0], REGIMENES[S.regimen].dura[1]);
  }
  const R = REGIMENES[S.regimen];
  S.aEleccion--;

  // --- inflación ---
  S.inflMes = rnd(R.infl[0], R.infl[1]);
  S.ipc *= (1 + S.inflMes);

  /* --- dólar ---
     A diez años el dólar empata con la inflación: no es una máquina de ganar.
     Lo que sí hace es moverse distinto — se atrasa durante meses (y ahí el que
     está dolarizado pierde contra los precios) y después corrige de un saque.
     Sin esto, el juego enseñaría "comprá dólares y listo", que es mentira. */
  /* Los dos coeficientes de abajo definen dónde se planta el tipo de cambio real
     a la larga: el equilibrio está donde (1 − tcr) · reversión = atraso · pisada.
     Con reversión .16 y pisada .20, queda entre 0,92 y 1,05 según el régimen, que
     es lo correcto — el dólar oscila alrededor de la paridad, no debajo.
     Con los valores anteriores (.05 y .45) el equilibrio en inflación alta daba
     0,46: el dólar perdía la mitad de su valor real y la escena del dólar caro
     no se disparaba nunca. */
  let d = S.inflMes                          // sigue a los precios
        + rnd(-.010, .010)                   // ruido
        - (S.tcr - 1) * .16                  // vuelve a la paridad si se fue lejos
        - rnd(R.atraso[0], R.atraso[1]) * .20; // el gobierno de turno lo pisa
  // Cuanto más atrasado está, más fuerte corrige cuando finalmente corrige.
  if(Math.random() < R.pSalto && S.tcr < 1.10){
    d += rnd(R.salto[0], R.salto[1]) * (1 + Math.max(0, 1 - S.tcr) * 1.8);
    S.avisos.push("Saltó el dólar. En una semana se movió lo que no se movía en meses.");
  }
  S.dolar *= (1 + d);
  S.tcr = (S.dolar / DOLAR_BASE) / S.ipc;

  /* --- inflación de estilo de vida ---
     El gasto persigue al sueldo hacia arriba y no baja solo. Un aumento se
     licúa en el nivel de vida en unos dos años: cambiás el celular, salís más,
     dejás de mirar el precio de algunas cosas. Nadie decide esto de una vez;
     pasa. Es lo que hace que el que gana el triple igual llegue justo. */
  if(S.trabajo){
    const objetivo = S.sueldo * S.ratioVida;
    if(objetivo > S.gastos) S.gastos += (objetivo - S.gastos) * .030;
    // y el listón sube despacio con la edad: lo que a los 22 era un lujo, a los 30 es normal
    // El tope frena el crecimiento; nunca baja lo que ya estaba. Con Math.min a
    // secas, el origen que arranca en 0,91 se veía empujado a 0,90 — o sea que
    // el sistema le regalaba margen justo al que menos tiene.
    if(S.ratioVida < .90) S.ratioVida = Math.min(S.ratioVida + .0002, .90);
  }

  // --- los gastos se ajustan TODOS los meses, el sueldo no ---
  const ajuste = 1 + S.inflMes * rnd(.85, 1.10);
  S.gastos *= ajuste;
  S.gastosPiso *= ajuste;
  S.gastos = Math.max(S.gastos, S.gastosPiso);

  // --- paritaria: llega tarde y casi siempre por debajo ---
  S.mesesDesdeParitaria++;
  if(S.trabajo && S.mesesDesdeParitaria >= rndI(5,7)){
    const atraso = S.ipc / S.ipcUltimaParitaria - 1;
    const cobertura = rnd(R.parit[0], R.parit[1]);
    const sube = atraso * cobertura;
    S.sueldo *= (1 + sube);
    /* Paritaria tras paritaria por debajo de la inflación, el sueldo real se
       hundiría hasta desaparecer. En la vida real no pasa: cuando cae mucho
       aparece la presión — gremios, mercado, gente que se va a otro lado — y
       recupera una parte. Nunca vuelve del todo, pero no se hunde. */
    if(S.sueldo / S.ipc < S.sueldoObjetivo * .80){
      S.sueldo *= rnd(1.05, 1.16);
      S.avisos.push("Se reabrió la paritaria: el sueldo había quedado muy atrás.");
    }
    S.ipcUltimaParitaria = S.ipc;
    S.mesesDesdeParitaria = 0;
    S.avisos.push("Cerró la paritaria: " + pct(sube) + " de aumento. La inflación del período fue " + pct(atraso) + ".");
    if(cobertura < .95) aprender("licuacion");
  }

  /* La referencia sube cuando de verdad progresás (un ascenso, un curso, cambiar
     de laburo) y se afloja de a poco si te quedás quieto. Es lo que hace que un
     paso atrás en la carrera pese, sin condenarte para siempre. */
  S.sueldoObjetivo = Math.max(S.sueldoObjetivo * .999, (S.sueldo / S.ipc) * .95);

  // --- ingresos ---
  if(S.trabajo){
    /* El sueldo en blanco cae igual todos los meses. El del monotributista se
       mueve solo, y el del comercio familiar sigue a la economía: en crisis
       vende menos, y ahí se junta lo peor de los dos mundos — te va mal cuando
       a todo el mundo le va mal. */
    let entra = S.sueldo;
    if(S.trabajoTipo === "monotributo"){
      entra *= rnd(.74, 1.26);
      S.pesos -= S.sueldo * .040;            // monotributo, todos los meses
      S.detalle.push(["Monotributo", -S.sueldo * .040]);
      S.egMes += S.sueldo * .040;
    }
    if(S.trabajoTipo === "comercio"){
      const clima = { estable: 1.12, alta: 1.00, volatil: .95, crisis: .78 }[S.regimen];
      entra *= clima * rnd(.88, 1.12);
    }
    cobrar(entra, S.trabajoTipo === "blanco" ? "Sueldo" : "Lo que entró");
    S.sinTrabajo = 0;
    const m = fechaMes();
    // El aguinaldo existe en relación de dependencia y en ningún otro lado.
    if((m === 5 || m === 11) && S.trabajoTipo === "blanco") cobrar(S.sueldo / 2, "Medio aguinaldo");
  } else {
    S.sinTrabajo++;
  }

  // --- egresos fijos ---
  gastar(S.gastos, "Gastos del mes");
  if(S.cuotas.length){
    const c = cuotasMes();
    gastar(c, "Cuotas (" + S.cuotas.length + ")");
    S.cuotas.forEach(x => x.restantes--);
    const term = S.cuotas.filter(x => x.restantes <= 0);
    term.forEach(x => S.avisos.push("Terminaste de pagar: " + x.desc + "."));
    S.cuotas = S.cuotas.filter(x => x.restantes > 0);
  }

  moverMercados(R);
  if(!S.snap) S.snap = fotoMercados();

  // --- rendimientos y deuda ---
  S.idxPlazo *= (1 + tasaPF());
  if(S.plazo > 0){
    const t = tasaPF();
    S.ultimaTasaPF = t;
    S.plazo *= (1 + t); S.plazoMeses++;
    // La lección aparece el día que la tasa le pierde a la inflación, no antes.
    if(t < S.inflMes && S.plazoMeses > 2) aprender("tasaReal");
  }
  if(S.pesos > S.gastos * 3 && S.inflMes > .02) aprender("costoOport");
  if(S.mes > 30 && S.gastos / S.sueldo > S.ratioVida * .97) aprender("nivelVida");
  if(S.deuda > 0){
    const i = S.deuda * tasaDeuda();
    S.deuda += i;
    if(S.deuda > S.sueldo) aprender("interesComp");
    S.detalle.push(["Intereses de la tarjeta", -i]);
    S.egMes += i;
    // pago automático si hay con qué: primero la deuda cara
    if(S.pesos > S.deuda){ S.pesos -= S.deuda; S.avisos.push("Cancelaste la tarjeta: " + fmt(S.deuda) + "."); S.deuda = 0; }
    else if(S.pesos > 0 && S.deuda > S.gastos * 2){
      const p = S.pesos * .5; S.pesos -= p; S.deuda -= p;
      S.avisos.push("Pagaste " + fmt(p) + " de tarjeta para que no siga creciendo.");
    }
    // Si el saldo pasa el límite, el banco te refinancia: sale del rojo de la
    // tarjeta y entra como cuota fija durante dos años. Alivia hoy, pesa después.
    const lim = limiteCredito();
    if(S.deuda > lim){
      const exceso = S.deuda - lim;
      S.deuda = lim;
      S.cuotas.push({ monto: exceso / 24, restantes: 24, desc: "Refinanciación de tarjeta" });
      animo(-4);
      S.avisos.push("Te refinanciaron " + fmt(exceso) + " de tarjeta en 24 cuotas. Ya no te dan más crédito.");
    }
  }
  // Meses seguidos en los que lo fijo supera lo que entra. Un mes malo le pasa a
  // cualquiera; diez seguidos es otra cosa, y es lo que define la insolvencia.
  S.mesesAhogado = egresoFijo() > (S.trabajo ? S.sueldo : 0) * 1.05 ? S.mesesAhogado + 1 : 0;
  S.picoDeuda = Math.max(S.picoDeuda, S.deuda);
  if(S.deuda > 0) S.mesesEnRojo++;

  // --- logros que se ganan viviendo, no eligiendo ---
  if(aire() >= 6) lograr("primerColchon");
  if(S.regimen === "crisis" && S.deuda === 0 && S.mes > 12) lograr("sobreviviente");

  /* --- ánimo ---
     Baja sola cuando no hay margen y sube sola cuando lo hay, pero despacio:
     lo que de verdad la mueve son las decisiones. Si el desgaste pasivo pesara
     más que lo que elegís, daría lo mismo elegir. */
  /* --- ánimo ---
     La vida desgasta siempre, tengas plata o no. Antes el aire alto REGALABA
     ánimo, y eso rompía la regla principal del juego: acumular salía gratis y
     no gastar nunca era la jugada óptima. Ahora el saldo de la cuenta no te
     hace feliz — solo evita que la falta de plata te destruya.

     Lo único que sube el ánimo son las decisiones: viajar, salir, la gente, y
     las tres cosas de abajo, que son inversiones en uno mismo con un costo
     mensual concreto. Guardar todo diez años y no vivir nada ahora termina en
     quiebre, que es exactamente lo que el juego quiere que se sienta. */
  const a = aire();
  animo(a < 0 ? -2.0 : a < 1 ? -1.0 : -.22);
  if(S.deuda > S.sueldo) animo(-.8);
  if(!S.trabajo) animo(-1.8);
  // Lo que elegiste para cuidarte sigue rindiendo, no fue un gasto de un día.
  if(S.flags.terapia) animo(.34);
  if(S.flags.pareja)  animo(.26);
  if(S.flags.entrena) animo(.30);
  /* Seguir en el cuarto de siempre a los veintipico largos tiene un costo que
     no aparece en ninguna planilla. Sin esto, el origen "casa" no pagaba nunca
     por su ventaja. */
  if(S.origen === "casa" && !S.flags.seFue && S.mes > 40) animo(-.30);
  // Los primeros años lejos de los tuyos, sin red y sin nadie a quien llamar.
  if(S.flags.lejos && S.mes < 48) animo(-.15);
  S.animoSuma += S.animo; S.animoN++;
  S.animoCero = S.animo <= 2 ? S.animoCero + 1 : 0;

  // --- despido aleatorio ---
  if(S.trabajo && S.mes > 8 && Math.random() < R.pDespido){
    S.trabajo = null;
    /* Un tercio de las veces no hay indemnización: en negro, monotributo, o la
       empresa que "va a arreglar" y no arregla. Eso es lo que convierte un
       despido en una emergencia. */
    if(S.trabajoTipo !== "blanco" || Math.random() < .25){
      S.avisos.push(S.trabajoTipo === "blanco"
        ? "Te desvincularon sin indemnización: estabas por fuera, y lo que prometen arreglar va a tardar meses."
        : "Se terminó. Sin relación de dependencia no hay indemnización que reclamar: simplemente deja de entrar plata.");
      animo(-14);
    } else {
      S.avisos.push("Te desvincularon. Te pagan una indemnización y a partir del mes que viene no entra más nada.");
      cobrar(S.sueldo * rndI(2,5), "Indemnización");
      animo(-9);
    }
  }

  // Patrimonio en pesos constantes: en pesos corrientes toda curva sube y no dice nada.
  S.serie.push({ m: S.mes, p: patrimonio() / S.ipc });

  // --- carteras sombra: MISMO flujo de caja, tres estrategias ---
  const neto = S.inMes - S.egMes;
  S.aporteTotal += Math.max(0, neto);
  S.simPesos += neto;
  S.simPlazo = S.simPlazo * (1 + tasaPF()) + neto;
  S.simUsd += neto / S.dolar;
  S.simIndice += neto / S.dolar / S.indicePrecio;   // en unidades del índice
  S.simBono   += neto / S.dolar / S.idxBono;        // en unidades de retorno total del bono

  guardar();
}

   ========================================================================== */

/* Combina los dos ejes en el punto de partida concreto de la partida. */
function armarArranque(viv, tra){
  return {
    id: viv.id, trabajoTipo: tra.id,
    pesos: viv.pesos,
    sueldo: tra.sueldo,
    gastos: Math.round(tra.sueldo * viv.ratio),
    trabajo: tra.puesto,
    flags: Object.assign({}, viv.flags, tra.flags),
  };
}

},
{
  /* --- CAMINOS SEGÚN EL ARRANQUE ---

     "monotributista" cambiaba unos números y después vivías la vida de un
     empleado igual. Las de trabajo traen además las lecciones que le faltaban
     al juego: caja contra ganancia, costo de reposición, y qué se compra con
     los descuentos del recibo de sueldo. */

  texto: [
    () => `<p>Cerrás el mejor mes del año: facturás ${fmt(S.sueldo * 1.7)}.</p>
    <p>Y en el mail dice, en letra chica, "pago a 90 días". Tres meses de laburo ya hecho que
    vas a cobrar en septiembre.</p>`,
    () => `<p>Otra vez. El cliente grande aprueba la factura y avisa que el pago sale con el
    cierre del trimestre.</p><p>Mientras tanto el alquiler vence el día 10.</p>`,
  ],
  opciones: [
    { txt:"Aguantar con lo que tenés",
      sub:"Si hay colchón, es solo esperar.",
      hacer(){ aprender("cajaVsGan");
        const holgado = aireLiquido() >= 2;
        if(!holgado) gastar(S.gastos * .5, "Tapar el bache hasta cobrar");
        animo(holgado ? -2 : -8);
        return holgado
          ? `<p>Esperás los tres meses sin drama.</p>
             <p>Facturar no es cobrar, y la diferencia entre las dos cosas la banca tu colchón.
             El que trabaja por su cuenta necesita más ahorro que un empleado, no menos: no es
             prudencia, es que el sistema le pide capital de trabajo.</p>`
          : `<p>Tapás los meses como podés, con tarjeta y pidiendo prórrogas.</p>
             <p>Tuviste el mejor mes del año y estuviste al borde de no llegar. Se puede ganar
             mucho y quedarse sin caja: la mayoría de los que cierran, cierran así.</p>`; } },
    { txt:"Pedir un adelanto con descuento",
      sub:"Cobrás ya, resignando una parte.",
      hacer(){ aprender("cajaVsGan"); cobrar(S.sueldo * 1.7 * .86, "Adelanto con descuento");
        return `<p>Aceptan pagarte a los diez días con un 14% menos.</p>
        <p>Ese 14% es lo que cuesta la plata hoy contra la plata en tres meses. Suena a
        regalarla, y a veces es lo correcto: nadie quiebra por ganar menos, quiebran por no
        tener con qué pagar el martes.</p>`; } },
    { txt:"Decirle que así no trabajás",
      sub:"Perdés el cliente. Ganás la regla.",
      hacer(){ aprender("cajaVsGan"); S.sueldo *= rnd(.80, .92); animo(3);
        return `<p>Le contestás que trabajás a treinta días y que lo entendés si no le sirve.</p>

        tarde: un cliente que te financia con tu propia plata no es un buen cliente, es un
        préstamo que le estás dando vos.</p>`; } },
  ]
},

},
{

  texto: () => `<p>Te llama alguien de otra empresa. El puesto es parecido y ofrecen

    { txt:"Quedarte donde estás",

        asado: aguinaldo, indemnización, y que un mes de enfermedad no sea un mes sin cobrar.</p>`; } },
  ]
},
{

    { txt:"Financiarlo como se pueda",
      sub:"Cuotas del sanatorio y lo que entre en la tarjeta.",
      hacer(){ S.flags.emergencia = true; aprender("interesComp");

    { txt:"Juntarlo entre los hermanos y los tíos",

let pendientes = [];    // resúmenes de meses acumulados sin escena

const ESPERA_REPETIBLE = 30;   // meses antes de que un evento de la diaria vuelva

function escenaDisponible(){
  // 0) dos cosas tapan cualquier otra: quedarte sin laburo y el bajón anímico
  const urgentes = [
    { id:"eleccion",         listo: () => !!S.eleccionPendiente,           espera: 2 },
    { id:"volver-a-laburar", listo: () => !S.trabajo && S.sinTrabajo >= 2, espera: 5 },
    { id:"bajon",            listo: () => S.animo < 22,                    espera: 7 },
    { id:"pre-eleccion",     listo: () => S.aEleccion <= 4 && S.aEleccion > 0 && S.mes > 8,
      espera: 40 },
  ];
  for(const u of urgentes){
    if(!u.listo()) continue;
    const visto = S.usados[u.id];
    if(visto == null || S.mes - visto >= u.espera) return EVENTOS.find(e => e.id === u.id);
  }
  /* 1) hitos, en el orden que le tocó a esta vida. El mes viene del guion
     sorteado al empezar, no del que está escrito en la escena. */
  for(const h of HITOS){
    if(S.usados[h.id] != null) continue;
    const g = S.guion[h.id];
    if(!g || !g.ocurre) continue;
    if(S.mes < g.mes) continue;
    if(h.cond && !h.cond()) continue;
    return h;
  }
  /* 2) eventos al azar. Esta probabilidad es, en la práctica, cuánto dura una
     partida: cada punto acá son pantallas de más o de menos. Estaba en .55 y
     daban 53 escenas — media hora larga de lectura, que es más de lo que
     aguanta alguien que no diseñó el juego. */
  if(Math.random() < .21){
    const elegibles = EVENTOS.filter(e => {
      if(!S.guion.eventos[e.id]) return false;   // no todo le pasa a todo el mundo
      const visto = S.usados[e.id];
      if(visto != null && !(e.repetible && S.mes - visto >= ESPERA_REPETIBLE)) return false;
      return !e.cond || e.cond();
    });
    if(elegibles.length){
      const bolsa = [];
      elegibles.forEach(e => { for(let i = 0; i < (e.peso || 1); i++) bolsa.push(e); });
      return pick(bolsa);
    }
  }
  return null;
}

/* Tres formas de que la década se corte antes de tiempo. No son castigos por
   jugar mal: son las cosas que de verdad terminan una etapa. Todas avisan
   varios meses antes, así que siempre hay margen para reaccionar. */
function finalTemprano(){
  if(S.animoCero >= 6)
    return { id:"quiebre", titulo:"No llegaste entero",
      texto:`<p>No fue un mes puntual. Fue medio año en el que te costaba levantarte, y hubo
      varias señales antes de esta.</p>
      <p>Un día no fuiste a trabajar y no avisaste. Tu hermana te vino a buscar y te llevó a
      la casa de tus viejos, donde te quedaste dormido doce horas.</p>
      <p>Vas a estar bien. Pero esta década se terminó acá, y no la terminó la plata: la terminó
      todo lo que fuiste postergando para poder ocuparte de la plata.</p>` };

  if(!S.trabajo && S.sinTrabajo >= 9 && S.deuda >= limiteCredito() * .85)
    return { id:"fondo", titulo:"Tocaste fondo",
      texto:`<p>Diez meses sin que entre nada y una deuda que ya nadie te refinancia.</p>
      <p>Entregás el departamento un sábado, con dos bolsos y la tele que ya casi terminabas de
      pagar. Volvés a tu cuarto de siempre, que tu vieja no tocó.</p>
      <p>No hubo una decisión que te trajo acá. Hubo una seguidilla de meses sin margen, y cuando
      no hay margen las decisiones las toma la urgencia.</p>` };

  /* Insolvencia real: lo que tenés que pagar todos los meses supera lo que
     entra, tenés deuda cara encima y no hay patrimonio del cual sacarlo.
     Antes se medía el total de cuotas comprometidas, y con eso un crédito
     hipotecario a cinco años alcanzaba solo para gatillar el final — que es
     justo al revés: la hipoteca es la deuda sana. */
  if(S.mes > 24 && S.mesesAhogado >= 10 && patrimonio() < -egresoFijo() * 3
     && S.deuda > limiteCredito() * .7)
    return { id:"concurso", titulo:"No daban los números",
      texto:`<p>Te sentás con alguien que sabe y hacen la cuenta completa. Con lo que entra y lo
      que se debe, no hay forma.</p>
      <p>Arreglás como se puede: cuotas eternas, algo de ayuda familiar, y una vergüenza que no
      le contás a nadie.</p>
      <p>Lo que se llevó todo no fue un gasto grande. Fueron los intereses, que trabajan todos
      los días y no se toman vacaciones.</p>` };
  return null;
}

function siguiente(){
  for(;;){
    if(S.mes >= DURACION){ return pantallaFinal(); }
    avanzarMes();
    const corte = finalTemprano();
    if(corte){ S.finTemprano = corte; return pantallaFinal(); }
    if(tocaRevision()){ pendientes.push(resumenMes()); return pantallaCartera(); }
    pendientes.push(resumenMes());
    const esc = escenaDisponible();
    if(esc){
      S.usados[esc.id] = S.mes;
      S.vistas[esc.id] = (S.vistas[esc.id] || 0) + 1;
      return pantallaEscena(esc);
    }
    if(pendientes.length >= 4) return pantallaInterludio();
  }
}

function resumenMes(){
  return {
    mes: fechaMes(), anio: fechaAnio(),
    detalle: S.detalle.slice(), avisos: S.avisos.slice(),
    infl: S.inflMes, dolar: S.dolar, neto: S.inMes - S.egMes,
    // Cuánto se movió tu plata guardada contra cuánto se movieron los precios.
    // El número solo no dice nada; la resta sí.
    tasa: S.plazo > 0 ? S.ultimaTasaPF : null,
    tcr: S.tcr,
  };
}

     año y la barra contestan "¿cuánto falta?" sin que haya que preguntarlo. */
