<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Fin de Mes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314110f'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='%23d9a441' font-family='Georgia,serif'>$</text></svg>">
<style>
:root{
  --bg:#14110f; --card:#1c1815; --card2:#221d19; --line:#302925;
  --text:#ece5dd; --muted:#8f857a; --dim:#645b52;
  --oro:#d9a441; --verde:#6fbf8b; --rojo:#e2726e; --azul:#7ba6d9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px; margin:0 auto; padding:0 18px 60px}
.serif{font-family:Georgia,"Times New Roman",serif}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:0; z-index:20; background:rgba(20,17,15,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:10px 0 9px; margin-bottom:22px;
}
.hud-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
.fecha{font-size:12.5px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.edad{font-size:12.5px; color:var(--dim)}
.chips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:5px 9px; font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.chip b{font-weight:600; margin-left:4px}
.chip .lbl{color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em}
.chip.mala b{color:var(--rojo)} .chip.buena b{color:var(--verde)} .chip.oro b{color:var(--oro)}

/* ---------- barra de ánimo ---------- */
.animo-fila{display:flex; align-items:center; gap:8px; margin-top:9px}
.animo-lbl{font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; flex:0 0 auto}
.animo-bar{flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden}
.animo-fill{height:100%; transition:width .5s ease, background .5s ease}

/* ---------- tarjetas ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px}
.card.tenue{background:var(--card2); border-style:dashed}
.eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--oro); margin-bottom:10px}
.eyebrow.gris{color:var(--dim)}
h1{font-size:30px; line-height:1.15; margin:0 0 14px; font-weight:600}
h2{font-size:19px; line-height:1.3; margin:0 0 12px; font-weight:600}
.texto{font-size:17px; line-height:1.62; color:#ddd4ca}
.texto p{margin:0 0 13px} .texto p:last-child{margin-bottom:0}
.texto em{color:var(--text); font-style:italic}

/* ---------- opciones ---------- */
.ops{display:flex; flex-direction:column; gap:10px; margin-top:6px}
.op{
  width:100%; text-align:left; background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:12px; padding:15px 16px;
  font-family:inherit; font-size:15.5px; line-height:1.45; cursor:pointer;
  transition:border-color .15s, background .15s, transform .08s;
}
.op:hover{border-color:#4a4038; background:var(--card2)}
.op:active{transform:scale(.988)}
.op .sub{display:block; margin-top:5px; font-size:13px; color:var(--muted); line-height:1.4}
.op[disabled]{opacity:.42; cursor:not-allowed}
.op[disabled]:hover{border-color:var(--line); background:var(--card)}

/* ---------- consecuencia ---------- */
.conseq{border-left:2px solid var(--oro); padding-left:15px; margin:4px 0 18px; font-size:16px; line-height:1.6; color:#ddd4ca}
.conseq p{margin:0 0 10px} .conseq p:last-child{margin-bottom:0}

/* ---------- cierre de mes ---------- */
.mes-linea{display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-size:13.5px; padding:5px 0; font-variant-numeric:tabular-nums}
.mes-linea span:first-child{color:var(--muted); flex:0 0 auto; white-space:nowrap}
.mes-linea.total{border-top:1px solid var(--line); margin-top:6px; padding-top:9px; font-weight:600}
.pos{color:var(--verde)} .neg{color:var(--rojo)}
.aviso{font-size:13.5px; color:var(--oro); background:rgba(217,164,65,.07); border-radius:8px; padding:9px 12px; margin-top:10px; line-height:1.45}

/* ---------- botones ---------- */
.btn{
  display:block; width:100%; background:var(--text); color:var(--bg); border:none;
  border-radius:12px; padding:15px; font-family:inherit; font-size:15.5px; font-weight:600;
  cursor:pointer; transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn.ghost{background:none; color:var(--muted); border:1px solid var(--line); font-weight:500}
.btn.ghost:hover{color:var(--text); border-color:#4a4038}

/* ---------- final ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0}
.stat{background:var(--card2); border-radius:10px; padding:13px}
.stat .n{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.stat .l{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.3}
.comp{display:flex; align-items:center; gap:10px; padding:9px 0; font-size:14px; border-bottom:1px solid var(--line)}
.comp:last-child{border-bottom:none}
.comp .nom{flex:1} .comp .val{font-variant-numeric:tabular-nums; font-weight:600}
.comp .barra{height:5px; background:var(--line); border-radius:3px; width:78px; overflow:hidden}
.comp .barra i{display:block; height:100%; background:var(--dim)}
.comp.yo .nom{color:var(--oro); font-weight:600} .comp.yo .barra i{background:var(--oro)}

/* ---------- conceptos y logros ---------- */
.concepto{padding:16px 18px}
.concepto-n{font-family:Georgia,serif; font-size:17px; color:var(--oro); margin-bottom:7px}
.concepto-t{font-size:15px; line-height:1.58; color:#ddd4ca}
.pendientes{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
.pendiente{font-size:12.5px; color:var(--dim); border:1px dashed var(--line);
  border-radius:7px; padding:5px 9px}
.logro{display:flex; gap:11px; align-items:baseline; padding:8px 0; font-size:14.5px;
  border-bottom:1px solid var(--line)}
.logro:last-child{border-bottom:none}
.logro-tic{color:var(--oro); font-size:11px; flex:0 0 auto}
.logro-d{display:block; font-size:13px; color:var(--muted); margin-top:2px}

/* ---------- revisión anual de cartera ---------- */
.rubro{padding:12px 0; border-bottom:1px solid var(--line)}
.rubro:last-of-type{border-bottom:none}
.rubro-cab{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px}
.rubro-n{font-size:14.5px}
.rubro-v{font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.rubro-hoy{color:var(--dim); font-size:11.5px}
.rubro-ctrl{display:flex; align-items:center; gap:10px}
.paso{width:34px; height:34px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  background:var(--card2); color:var(--text); font-size:17px; font-family:inherit; cursor:pointer;
  line-height:1; display:flex; align-items:center; justify-content:center}
.paso:hover:not([disabled]){border-color:#4a4038; color:var(--oro)}
.paso[disabled]{opacity:.3; cursor:not-allowed}
.rubro-barra{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.rubro-barra i{display:block; height:100%; background:var(--oro); transition:width .18s ease}
.rubro-pct{font-size:13.5px; font-variant-numeric:tabular-nums; width:38px; text-align:right; flex:0 0 auto}
.rubro-total{margin-top:14px; padding-top:11px; border-top:1px solid var(--line);
  font-size:13px; text-align:right}
.rubro-total.ok{color:var(--verde)} .rubro-total.mal{color:var(--oro)}
.btn[disabled]{opacity:.4; cursor:not-allowed}

/* ---------- aviso de desbloqueo ---------- */
.desbloqueo{display:flex; gap:11px; align-items:flex-start; background:var(--card2);
  border:1px solid var(--line); border-left:2px solid var(--oro); border-radius:10px;
  padding:13px 15px; margin-bottom:12px}
.desbloqueo .ico{color:var(--oro); font-size:12px; flex:0 0 auto; line-height:1.5}
.desbloqueo.nuevo-instr{border-left-color:var(--verde)}
.desbloqueo.nuevo-instr .ico, .desbloqueo.nuevo-instr .ttl{color:var(--verde)}
.desbloqueo .cab{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); margin-bottom:5px}
.desbloqueo .ttl{font-family:Georgia,serif; font-size:16px; color:var(--oro); margin-bottom:5px}
.desbloqueo .cpo{font-size:14.5px; line-height:1.55; color:#ddd4ca}

.fade{animation:fade .32s ease}
@media (prefers-reduced-motion:reduce){ .fade{animation:none} }
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.nota{font-size:12.5px; color:var(--dim); line-height:1.5; margin-top:20px}
hr.sep{border:none; border-top:1px solid var(--line); margin:22px 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="hud"></div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ==========================================================================
   FIN DE MES — juego narrativo de decisiones. Una vida argentina, mes a mes.
   Todo el estado vive en memoria; solo se persiste la partida en curso.
   ========================================================================== */

const CLAVE = "finDeMes.partida.v1";
const MESES_NOMBRE = ["enero","febrero","marzo","abril","mayo","junio",
                      "julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DURACION = 120;            // 10 años
const MES_INICIAL = 2;           // arranca en marzo
const ANIO_INICIAL = 2026;

/* ---------- utilidades ---------- */
const fmt   = n => "$" + Math.round(n).toLocaleString("es-AR");
const fmtK  = n => Math.abs(n) >= 1e6 ? "$" + (n/1e6).toFixed(1).replace(".",",") + "M" : fmt(n);
const usd   = n => "US$" + Math.round(n).toLocaleString("es-AR");
const pct   = n => (n*100).toFixed(1).replace(".",",") + "%";
const rnd   = (a,b) => a + Math.random()*(b-a);
const rndI  = (a,b) => Math.floor(rnd(a,b+1));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ==========================================================================
   MACROECONOMÍA
   El régimen está oculto. El jugador solo ve inflación del mes y precio del
   dólar. Cada 24-40 meses se re-sortea: nadie aprende "el" régimen de memoria.
   ========================================================================== */
/* Cada régimen define inflación, cuánto se atrasa el dólar, con qué frecuencia
   salta, qué tan mal le va a la paritaria y el riesgo de quedarse sin laburo.
   `dura` son los meses que puede durar; `sale` a dónde puede derivar después.
   La crisis es corta y siempre desemboca en otra cosa: nadie vive diez años en
   crisis, y si el juego lo permitiera los números se irían a la hiperinflación. */
const REGIMENES = {
  estable: { infl:[.004,.016], dura:[18,40], atraso:[.00,.06],  pSalto:.010, salto:[.05,.12],
             tasaPF:[1.02,1.35], parit:[.85,1.15], pDespido:.005, sale:["alta","volatil"] },
  alta:    { infl:[.022,.045], dura:[16,32], atraso:[.02,.10],  pSalto:.045, salto:[.10,.22],
             tasaPF:[.88,1.12],  parit:[.68,1.00], pDespido:.010, sale:["estable","volatil","crisis"] },
  volatil: { infl:[.015,.038], dura:[12,24], atraso:[-.04,.10], pSalto:.075, salto:[.14,.30],
             tasaPF:[.82,1.18],  parit:[.65,1.02], pDespido:.013, sale:["alta","estable","crisis"] },
  crisis:  { infl:[.045,.085], dura:[5,12],  atraso:[-.10,.02], pSalto:.10,  salto:[.18,.38],
             tasaPF:[.62,.92],   parit:[.55,.85], pDespido:.028, sale:["alta","estable"] },
};
const NOMBRES_REG = Object.keys(REGIMENES);
const DOLAR_BASE = 1350;   // referencia para medir el atraso cambiario

/* ==========================================================================
   LA ESCALERA
   Los instrumentos no están todos disponibles desde el minuto uno: se van
   habilitando según cuánto aire tengas. No es una traba artificial — es la
   regla que más plata le ahorra a la gente y que nadie respeta: primero el
   colchón, después invertir. Querer comprar bonos sin tener para el mes que
   viene no es ser audaz, es no haber entendido el orden.
   ========================================================================== */
const ESCALERA = [
  { id:"plazo",  aire:.5, n:"Plazo fijo",
    d:"Le prestás plata al banco por treinta días. A veces le gana a la inflación, a veces no, pero pierde mucho menos que quedarte quieto." },
  { id:"dolar",  aire:1.5, n:"Dólares",
    d:"Dejás de perder contra la inflación y pasás a depender de otra cosa: que el dólar acompañe. Es cambiar de riesgo, no sacártelo de encima." },
  { id:"bono",   aire:4, n:"Bonos del país",
    d:"Le prestás plata al Estado y te paga un cupón todos los meses. Paga tanto justamente porque puede no pagarte: cuando hay elecciones, el precio se mueve más que cualquier otra cosa." },
  { id:"indice", aire:6, n:"Índice global",
    d:"Comprás un pedacito de las quinientas empresas más grandes del mundo, en un solo movimiento. A diez años sube; en el medio se cae un 30% y hay que bancarlo sin vender." },
];

/* ---------- valuaciones ---------- */
// El bono y el índice cotizan en dólares; acá se pasan a pesos para sumarlos.
const valorBono   = () => S.bonoVN * (S.bonoPrecio / 100) * S.dolar;
const valorIndice = () => S.indiceUn * S.indicePrecio * S.dolar;
const tieneAcceso = id => !!S.instrumentos[id];

let S = null;   // estado de la partida

function nuevaPartida(origen){
  S = {
    mes: 0, edad: 22,
    origen: origen.id,
    pesos: origen.pesos, usd: 0, plazo: 0, plazoMeses: 0, deuda: 0,
    /* Bono del país, medido en valor nominal. Paga cupón todos los meses y
       puede dejar de pagarte para siempre. Precio en % de la paridad. */
    bonoVN: 0, bonoPrecio: 58, bonoDefault: false, cuponTotal: 0,
    // Índice global (el S&P vía CEDEAR), en dólares, base 100.
    indiceUn: 0, indicePrecio: 100, mesesCrash: 0,
    /* Ciclo electoral: la fecha marcada en el calendario donde cambia el país.
       Es lo único que el jugador sabe que va a pasar sin saber cómo sale. */
    aEleccion: 22, gobierno: pick(["ajuste","gasto"]), elecciones: 0,
    eleccionPendiente: null,          // resultado esperando que lo cuente una escena
    instrumentos: {},                 // escalones de la escalera ya habilitados
    cuotas: [],                       // {monto, restantes, desc}
    sueldo: origen.sueldo, gastos: origen.gastos, trabajo: origen.trabajo,
    // Por más que te achiques, hay un piso: comer, viajar, el techo.
    gastosPiso: origen.gastos * .55,
    // Referencia de cuánto valía tu sueldo el primer día, en términos reales.
    sueldoObjetivo: origen.sueldo,
    sinTrabajo: 0,                    // meses seguidos sin laburo
    animo: 62,
    dolar: DOLAR_BASE, tcr: 1,        // tcr: dólar medido contra la inflación. 1 = a la par
    ipc: 1, ipcUltimaParitaria: 1, mesesDesdeParitaria: 0,
    regimen: pick(["estable","alta","volatil"]), mesesRegimen: rndI(14,30),
    inflMes: .03,
    flags: {},                        // hitos narrativos alcanzados
    usados: {},                       // escenas ya vistas
    // acumuladores del mes en curso
    inMes: 0, egMes: 0, avisos: [], detalle: [],
    // carteras sombra: mismo flujo de caja, tres estrategias distintas
    simPesos: 0, simPlazo: 0, simUsd: 0, simIndice: 0,
    // métricas
    animoSuma: 0, animoN: 0, mesesEnRojo: 0, picoDeuda: 0, aporteTotal: 0,
    historia: [],                     // decisiones tomadas, para el epílogo
    conceptos: {}, logros: {},        // lo aprendido y lo conseguido
    nuevos: [],                       // desbloqueos pendientes de avisar
    animoCero: 0,                     // meses seguidos con el ánimo en el piso
    finTemprano: null,                // si la partida se corta antes de los 10 años
    ultimaRevision: -1,               // último cierre de año ya revisado
    golpes: 0, suertes: 0,            // cuántas veces te pegó y te sonrió el azar
  };
  return S;
}

/* ==========================================================================
   CONCEPTOS
   No hay tutorial. Cada idea se desbloquea el día que te pasa, y recién ahí
   se te explica lo que acabás de vivir. Al final ves cuáles te faltan: son
   los que solo aparecen si tomás otras decisiones.
   ========================================================================== */
const CONCEPTOS = {
  licuacion:   { n:"Licuación", t:"Tu sueldo es un número fijo en un mundo de precios que suben. Si el aumento llega cada seis meses y por debajo de la inflación, cada mes que pasa comprás un poco menos con lo mismo. No te sacaron plata: te la derritieron." },
  tasaReal:    { n:"Tasa real", t:"La tasa que te pagan menos la inflación. Un plazo fijo al 4% mensual con inflación del 5% te está haciendo perder 1% por mes, aunque el número de tu cuenta suba. Mirá siempre la resta, nunca el número solo." },
  fondo:       { n:"Fondo de emergencia", t:"Plata aburrida y disponible que no rinde casi nada. No sirve para ganar: sirve para que un golpe sea un golpe y no el principio de una espiral. Es lo que te deja rechazar el primer trabajo malo que aparezca." },
  interesComp: { n:"Interés compuesto", t:"Los intereses generan intereses. Juega a tu favor cuando invertís y en tu contra cuando debés. Con la tarjeta al 8% mensual, una deuda se duplica sola en menos de un año sin que compres nada más." },
  costoOport:  { n:"Costo de oportunidad", t:"Toda plata parada está eligiendo no estar en otro lado. Dejar pesos quietos con inflación no es 'no hacer nada': es elegir perder, solo que despacio y sin que se note." },
  diversif:    { n:"Diversificación", t:"Repartir para no depender de acertar. Nunca vas a ganar la charla del asado con esta estrategia, porque no hay anécdota. Es exactamente por eso que funciona a diez años." },
  atrasoCamb:  { n:"Atraso cambiario", t:"Cuando el dólar se queda quieto y los precios no, se está poniendo barato en términos reales. Nadie avisa. Podés pasarte meses sintiendo que te equivocaste, hasta que corrige en una semana." },
  cuotasInfl:  { n:"Cuotas sin interés", t:"Una cuota fija en pesos, con inflación alta, vale cada vez menos. Comprar en doce cuotas sin interés puede ser buen negocio. La trampa nunca es una cuota: son seis al mismo tiempo." },
  gastoFijo:   { n:"Gasto fijo", t:"Lo que pagás todos los meses para siempre. Un gasto grande de una vez casi nunca te hunde; un gasto fijo nuevo te acompaña una década. El auto no cuesta lo que pagaste: cuesta eso más todo lo que viene después." },
  capitalHum:  { n:"Capital humano", t:"Lo que sabés hacer. Es lo único de tu patrimonio que la inflación no puede licuar, que nadie te puede robar y que suele rendir más que cualquier inversión que te vayan a ofrecer." },
  riesgoContr: { n:"Riesgo de contraparte", t:"El que promete devolverte puede no devolverte, por mala fe o por mala suerte. Prestar plata es comprar una promesa. Prestá siempre pensando que capaz no vuelve." },
  tamApuesta:  { n:"Tamaño de la apuesta", t:"Importa más cuánto ponés que a qué le ponés. Una apuesta que no te cambia la vida si sale mal es una apuesta que podés repetir. La que te funde, no." },
  suerteHab:   { n:"Suerte y habilidad", t:"Un buen resultado no prueba que la decisión fue buena. Con las mismas cartas, la mayoría de las veces se pierde. Juzgá cómo decidiste, no cómo salió — es la única forma de aprender algo." },
  liquidez:    { n:"Liquidez", t:"Qué tan rápido podés convertir algo en plata sin perder valor. Un depto vale mucho y no te salva el martes que se rompe la heladera. Tener todo bien invertido y nada disponible es un problema disfrazado de virtud." },
  seguro:      { n:"Transferencia de riesgo", t:"Pagar poco todos los meses para que otro se coma la pérdida grande. Un seguro tiene rendimiento negativo esperado y aun así conviene, porque lo que te funde no es el promedio: es la cola." },
  estafa:      { n:"Si es demasiado bueno", t:"Rendimientos altos, garantizados y sin riesgo no existen juntos. Cuando alguien te ofrece los tres, la plata que reparte es la de los que entraron después. Vos podés ser cualquiera de los dos grupos." },
  riesgoPais:  { n:"Prima de riesgo", t:"Por qué un bono argentino paga 14% en dólares y uno alemán 2%. No es que Argentina sea generosa: es lo que hay que ofrecer para que alguien acepte la chance de no cobrar. El rendimiento alto es el precio del miedo, no un regalo." },
  default:     { n:"Default y quita", t:"Cuando el Estado no puede pagar, no desaparece la deuda: se reestructura. Te cambian tus bonos por otros que valen bastante menos. Ahí se ve que el cupón que venías cobrando era el pago por bancarte exactamente esto." },
  volatilidad: { n:"Volatilidad", t:"Cuánto se mueve algo mientras vas. El índice global sube a diez años y en el medio se cae un 30% dos o tres veces. La caída no es el problema; el problema es vender adentro de la caída." },
  horizonte:   { n:"Horizonte", t:"Cuánto tiempo podés dejar la plata quieta. Es lo que decide en qué podés invertir, mucho más que cuánta tenés. Plata que necesitás en seis meses no va a acciones, por más que las acciones rindan." },
  cicloElec:   { n:"Riesgo político", t:"Antes de una elección todos los activos del país cotizan con miedo, porque nadie sabe qué viene. No se gana adivinando el resultado: se gana estando parado de una forma que sobreviva a cualquiera de los dos." },
  concentr:    { n:"Concentración", t:"Poner mucho en una sola cosa. Cuando sale bien parece visión; cuando sale mal parece obvio que era una locura. Es la misma decisión en los dos casos — lo único que cambió fue la suerte." },
};

/* ==========================================================================
   LOGROS
   ========================================================================== */
const LOGROS = {
  primerColchon: { n:"Primer colchón",      d:"Llegaste a seis meses de aire" },
  sinDeuda:      { n:"Nunca debiste nada",  d:"Toda la década sin un peso de deuda" },
  sobreviviente: { n:"Sobreviviente",       d:"Pasaste una crisis sin endeudarte" },
  cabezaFria:    { n:"Cabeza fría",         d:"No vendiste tus dólares en el pico" },
  repartido:     { n:"No pusiste todo",     d:"Terminaste con pesos, dólares y plazo fijo a la vez" },
  vividor:       { n:"Valió la pena",       d:"Terminaste con el ánimo por encima de 75" },
  aguante:       { n:"Aguantaste",          d:"Te quedaste sin trabajo y saliste sin deuda" },
  buenPibe:      { n:"Buen pibe",           d:"Ayudaste a tu familia cuando hizo falta" },
  estudioso:     { n:"Te capacitaste",      d:"Invertiste en aprender algo" },
  escarmentado:  { n:"Escarmentado",        d:"Te comiste una estafa y seguiste de pie" },
};

function aprender(id){
  if(S.conceptos[id]) return;
  S.conceptos[id] = S.mes;
  S.nuevos.push({ tipo:"concepto", id });
}
function lograr(id){
  if(S.logros[id]) return;
  S.logros[id] = S.mes;
  S.nuevos.push({ tipo:"logro", id });
}

/* ---------- lecturas derivadas ---------- */
const fechaMes  = () => (MES_INICIAL + S.mes) % 12;
const fechaAnio = () => ANIO_INICIAL + Math.floor((MES_INICIAL + S.mes) / 12);
const patrimonio = () => S.pesos + S.usd * S.dolar + S.plazo
                       + valorBono() + valorIndice() - S.deuda;
const cuotasMes  = () => S.cuotas.reduce((a,c) => a + c.monto, 0);
const egresoFijo = () => S.gastos + cuotasMes();
const aire       = () => egresoFijo() > 0 ? patrimonio() / egresoFijo() : 0;
/* El aire que abre escalones cuenta solo lo que podés usar mañana. Un bono no
   te salva el martes que se rompe la heladera: eso es liquidez, no patrimonio. */
const aireLiquido = () => egresoFijo() > 0
  ? (S.pesos + S.usd * S.dolar + S.plazo - S.deuda) / egresoFijo() : 0;
/* La tasa a veces le gana a la inflación y a veces no, según el momento.
   Igual que el dólar: ninguna opción es siempre la ganadora. */
/* Más de cinco años de aire ya no cambia nada en la práctica: el número deja de
   ser informativo y solo infla el ego. Se muestra tope. */
const aireTexto = a => a <= 0 ? "0" : a > 60 ? "60+" : a.toFixed(1).replace(".", ",");
const tasaPF     = () => S.inflMes * rnd(REGIMENES[S.regimen].tasaPF[0], REGIMENES[S.regimen].tasaPF[1]);
const tasaDeuda  = () => S.inflMes + rnd(.030,.055);        // la tarjeta siempre gana
/* Nadie te presta infinito. El límite es lo que un banco de verdad te daría. */
const deudaTotal = () => S.deuda + S.cuotas.reduce((a,c) => a + c.monto * c.restantes, 0);
const limiteCredito = () => (S.trabajo ? S.sueldo * 2.5 : S.gastos * 1.5);

/* ---------- mutadores usados por las escenas ---------- */
function cobrar(n, desc){
  S.pesos += n; S.inMes += n;
  if(desc) S.detalle.push([desc, n]);
}
/** Gasta n. Si no alcanza la plata, el resto cae en la tarjeta — hasta el límite.
    Pasado el límite no hay más crédito: ahí no queda otra que achicarse, que es
    lo que pasa en la vida real cuando se te cierran las puertas. */
function gastar(n, desc){
  S.egMes += n;
  if(desc) S.detalle.push([desc, -n]);
  const disp = Math.max(0, S.pesos);
  if(disp >= n){ S.pesos -= n; return 0; }

  let falta = n - disp;
  S.pesos = 0;
  const margen = Math.max(0, limiteCredito() - S.deuda);
  const aTarjeta = Math.min(falta, margen);
  if(aTarjeta > 0){
    S.deuda += aTarjeta;
    S.avisos.push("No te alcanzaba: " + fmt(aTarjeta) + " quedaron en la tarjeta.");
  }
  const sinCubrir = falta - aTarjeta;
  if(sinCubrir > 0){
    // Se te acabó el crédito. Recortás para poder seguir — hasta donde se puede.
    S.gastos = Math.max(S.gastos * .93, S.gastosPiso);
    animo(-5);
    S.flags.sinCredito = true;
    S.avisos.push("Se te cortó el crédito. Tuviste que recortar el mes para poder cubrirlo.");
  }
  return falta;
}
function animo(n){ S.animo = clamp(S.animo + n, 0, 100); }
function comprarUsd(montoPesos){
  const efectivo = Math.min(montoPesos, Math.max(0, S.pesos));
  if(efectivo <= 0) return 0;
  const c = efectivo / (S.dolar * 1.02);        // spread de compra
  S.pesos -= efectivo; S.usd += c;
  return c;
}
function venderUsd(cant){
  const c = Math.min(cant, S.usd);
  if(c <= 0) return 0;
  const p = c * S.dolar * 0.98;                 // spread de venta
  S.usd -= c; S.pesos += p;
  return p;
}
/* Comprar y vender bonos e índice. Todo pasa por pesos y todo paga comisión:
   mover plata nunca es gratis, y esa es media razón por la que reacomodar la
   cartera todos los meses es peor negocio que dejarla quieta. */
const COMISION = .008;

function comprarBono(montoPesos){
  const m = Math.min(montoPesos, Math.max(0, S.pesos));
  if(m <= 0 || S.bonoPrecio <= 0) return 0;
  S.pesos -= m;
  const vn = (m * (1 - COMISION)) / S.dolar / (S.bonoPrecio / 100);
  S.bonoVN += vn;
  return vn;
}
function venderBono(vn){
  const v = Math.min(vn, S.bonoVN);
  if(v <= 0) return 0;
  const p = v * (S.bonoPrecio / 100) * S.dolar * (1 - COMISION);
  S.bonoVN -= v; S.pesos += p;
  return p;
}
function comprarIndice(montoPesos){
  const m = Math.min(montoPesos, Math.max(0, S.pesos));
  if(m <= 0) return 0;
  S.pesos -= m;
  const un = (m * (1 - COMISION)) / S.dolar / S.indicePrecio;
  S.indiceUn += un;
  return un;
}
function venderIndice(un){
  const u = Math.min(un, S.indiceUn);
  if(u <= 0) return 0;
  const p = u * S.indicePrecio * S.dolar * (1 - COMISION);
  S.indiceUn -= u; S.pesos += p;
  return p;
}

function ponerPlazo(monto){
  const m = Math.min(monto, Math.max(0, S.pesos));
  if(m <= 0) return 0;
  S.pesos -= m; S.plazo += m; S.plazoMeses = 1;
  return m;
}
function enCuotas(total, n, desc){
  S.cuotas.push({ monto: total / n, restantes: n, desc });
  S.egMes += 0;
}
function recordar(t){ S.historia.push({ mes: S.mes, t }); }

/* ==========================================================================
   CARTERA
   ========================================================================== */
const RUBROS = [
  { id:"pesos",  n:"Pesos en la cuenta", corto:"Pesos",   siempre:true },
  { id:"plazo",  n:"Plazo fijo",         corto:"Plazo"    },
  { id:"dolar",  n:"Dólares",            corto:"Dólares"  },
  { id:"bono",   n:"Bono del país",      corto:"Bono"     },
  { id:"indice", n:"Índice global",      corto:"Índice"   },
];
const rubrosAbiertos = () => RUBROS.filter(r => r.siempre || tieneAcceso(r.id));

function valores(){
  return { pesos: Math.max(0, S.pesos), plazo: S.plazo,
           dolar: S.usd * S.dolar, bono: valorBono(), indice: valorIndice() };
}
const totalCartera = () => Object.values(valores()).reduce((a,b) => a + b, 0);

/* Mueve solo la diferencia entre lo que tenés y lo que querés tener. Vender todo
   y recomprar pagaría comisión sobre el total — que es, de paso, la razón por la
   que reacomodar la cartera seguido es peor negocio que dejarla quieta. */
function rebalancear(objetivo){
  const v = valores(), total = totalCartera();
  if(total <= 0) return 0;
  let movido = 0;
  const meta = k => total * (objetivo[k] || 0) / 100;

  for(const k of ["plazo","dolar","bono","indice"]){
    const exceso = v[k] - meta(k);
    if(exceso <= 1) continue;
    movido += exceso;
    if(k === "plazo"){ const x = Math.min(exceso, S.plazo); S.plazo -= x; S.pesos += x; }
    if(k === "dolar")  venderUsd(exceso / S.dolar);
    if(k === "bono")   venderBono(exceso / ((S.bonoPrecio / 100) * S.dolar));
    if(k === "indice") venderIndice(exceso / (S.indicePrecio * S.dolar));
  }
  for(const k of ["plazo","dolar","bono","indice"]){
    const falta = Math.min(meta(k) - v[k], Math.max(0, S.pesos));
    if(falta <= 1) continue;
    movido += falta;
    if(k === "plazo")  ponerPlazo(falta);
    if(k === "dolar")  comprarUsd(falta);
    if(k === "bono")   comprarBono(falta);
    if(k === "indice") comprarIndice(falta);
  }
  return movido;
}

/* ==========================================================================
   MERCADOS
   ========================================================================== */

/* Cuánto vale el bono según quién gobierna y cómo viene el país. La lógica que
   tiene que quedar clara jugando: el bono paga mucho porque puede no pagarte.
   No es plata gratis, es que te están pagando por bancarte el riesgo. */
const BONO_OBJETIVO = { estable: 94, alta: 70, volatil: 61, crisis: 30 };

/* La elección es el único momento del juego con fecha conocida. Lo que no se
   sabe es el resultado ni, sobre todo, cómo va a reaccionar el mercado.

   Decisión de diseño importante: el precio NO se mueve según quién ganó, sino
   según cuánto se apartó de lo que ya estaba descontado. Si el bono subiera
   siempre con un signo político, el juego enseñaría a apostarle a ese signo —
   que es falso y además convertiría esto en un panfleto. Acá la sorpresa manda,
   y por eso no se puede farmear el resultado. */
function resolverEleccion(){
  S.elecciones++;
  const desgaste = (S.regimen === "crisis" || S.regimen === "alta") ? .74 : .42;
  const cambia = Math.random() < desgaste;
  const anterior = S.gobierno;
  if(cambia) S.gobierno = anterior === "ajuste" ? "gasto" : "ajuste";

  S.regimen = S.gobierno === "ajuste"
    ? pick(["estable","estable","volatil","crisis"])
    : pick(["alta","alta","volatil","estable"]);
  S.mesesRegimen = rndI(REGIMENES[S.regimen].dura[0], REGIMENES[S.regimen].dura[1]);

  const tilt = S.gobierno === "ajuste" ? .16 : -.16;
  const sorpresa = tilt + rnd(-.55, .55);
  const antes = S.bonoPrecio;
  S.bonoPrecio = clamp(S.bonoPrecio * (1 + sorpresa), 8, 118);
  S.aEleccion = 48;

  return { cambia, gobierno: S.gobierno, anterior,
           antes, ahora: S.bonoPrecio,
           subioBono: S.bonoPrecio > antes };
}

function moverMercados(R){
  // La elección se resuelve sola; la escena que la cuenta llega enseguida.
  if(S.aEleccion <= 0 && !S.eleccionPendiente) S.eleccionPendiente = resolverEleccion();

  // --- bono del país ---
  if(!S.bonoDefault){
    let obj = BONO_OBJETIVO[S.regimen] * (S.gobierno === "ajuste" ? 1.10 : .92);
    // Antes de la elección nadie quiere quedarse con papeles: el precio se hunde.
    if(S.aEleccion <= 6 && S.aEleccion > 0) obj -= (7 - S.aEleccion) * 3.4;
    S.bonoPrecio = clamp(S.bonoPrecio + (obj - S.bonoPrecio) * .16 + rnd(-3.5, 3.5), 8, 118);

    if(S.bonoVN > 0){
      const cupon = S.bonoVN * .011;              // ~14% anual en dólares
      S.usd += cupon; S.cuponTotal += cupon;
      if(S.mes % 6 === 0) S.avisos.push("Cobraste " + usd(cupon * 6) + " de cupones del bono.");
    }
    /* Default: la quita. Es lo que hace que el cupón alto no sea plata gratis,
       y solo pasa en crisis — que es exactamente cuando el bono se ve barato. */
    if(S.regimen === "crisis" && Math.random() < .020){
      S.bonoDefault = true;
      const quita = rnd(.55, .78);
      if(S.bonoVN > 0){
        S.bonoVN *= (1 - quita);
        S.bonoPrecio = rnd(18, 30);
        animo(-12); S.golpes++;
        aprender("default");
        S.avisos.push("El país entró en default. Te reestructuran el bono con una quita del "
          + Math.round(quita*100) + "% y dejan de pagar cupones.");
      }
    }
  } else if(Math.random() < .035){
    // Se reestructura y vuelve a pagar. Tarde, peor, pero vuelve.
    S.bonoDefault = false; S.bonoPrecio = rnd(32, 46);
    S.avisos.push("Cerró el canje de deuda. El bono vuelve a pagar cupones, más chicos.");
  }

  // --- índice global ---
  let r;
  if(S.mesesCrash > 0){ r = rnd(-.115, -.005); S.mesesCrash--; }
  else if(Math.random() < .013){
    S.mesesCrash = rndI(2, 5); r = rnd(-.135, -.045);
    if(S.indiceUn > 0){
      aprender("volatilidad");
      S.avisos.push("Se cayeron los mercados del mundo. Tu índice global está en rojo fuerte.");
    }
  }
  else r = .0065 + rnd(-.032, .042);            // sube a la larga, con ruido
  S.indicePrecio = Math.max(12, S.indicePrecio * (1 + r));

  // --- la escalera: habilitar lo que el colchón ya te permite ---
  const aL = aireLiquido();
  for(const e of ESCALERA){
    if(S.instrumentos[e.id] || aL < e.aire) continue;
    S.instrumentos[e.id] = S.mes;
    S.nuevos.push({ tipo:"instrumento", id: e.id });
  }
}

/* ==========================================================================
   EL PASO DEL MES
   ========================================================================== */
function avanzarMes(){
  S.mes++;
  if((MES_INICIAL + S.mes) % 12 === 0) S.edad++;
  S.avisos = []; S.detalle = []; S.inMes = 0; S.egMes = 0;

  /* --- régimen ---
     Cambia solo, y la crisis nunca es permanente. Pero el cambio grande se lo
     lleva la elección: ver `resolverEleccion`. Acá solo pasa la deriva lenta. */
  if(--S.mesesRegimen <= 0){
    S.regimen = pick(REGIMENES[S.regimen].sale);
    S.mesesRegimen = rndI(REGIMENES[S.regimen].dura[0], REGIMENES[S.regimen].dura[1]);
  }
  const R = REGIMENES[S.regimen];
  S.aEleccion--;

  // --- inflación ---
  S.inflMes = rnd(R.infl[0], R.infl[1]);
  S.ipc *= (1 + S.inflMes);

  /* --- dólar ---
     A diez años el dólar empata con la inflación: no es una máquina de ganar.
     Lo que sí hace es moverse distinto — se atrasa durante meses (y ahí el que
     está dolarizado pierde contra los precios) y después corrige de un saque.
     Sin esto, el juego enseñaría "comprá dólares y listo", que es mentira. */
  let d = S.inflMes                          // sigue a los precios
        + rnd(-.010, .010)                   // ruido
        - (S.tcr - 1) * .050                 // vuelve a la paridad si se fue lejos
        - rnd(R.atraso[0], R.atraso[1]) * .45; // el gobierno de turno lo pisa
  // Cuanto más atrasado está, más fuerte corrige cuando finalmente corrige.
  if(Math.random() < R.pSalto && S.tcr < 1.10){
    d += rnd(R.salto[0], R.salto[1]) * (1 + Math.max(0, 1 - S.tcr) * 1.8);
    S.avisos.push("Saltó el dólar. En una semana se movió lo que no se movía en meses.");
  }
  S.dolar *= (1 + d);
  S.tcr = (S.dolar / DOLAR_BASE) / S.ipc;

  // --- los gastos se ajustan TODOS los meses, el sueldo no ---
  const ajuste = 1 + S.inflMes * rnd(.85, 1.10);
  S.gastos *= ajuste;
  S.gastosPiso *= ajuste;
  S.gastos = Math.max(S.gastos, S.gastosPiso);

  // --- paritaria: llega tarde y casi siempre por debajo ---
  S.mesesDesdeParitaria++;
  if(S.trabajo && S.mesesDesdeParitaria >= rndI(5,7)){
    const atraso = S.ipc / S.ipcUltimaParitaria - 1;
    const cobertura = rnd(R.parit[0], R.parit[1]);
    const sube = atraso * cobertura;
    S.sueldo *= (1 + sube);
    /* Paritaria tras paritaria por debajo de la inflación, el sueldo real se
       hundiría hasta desaparecer. En la vida real no pasa: cuando cae mucho
       aparece la presión — gremios, mercado, gente que se va a otro lado — y
       recupera una parte. Nunca vuelve del todo, pero no se hunde. */
    if(S.sueldo / S.ipc < S.sueldoObjetivo * .80){
      S.sueldo *= rnd(1.05, 1.16);
      S.avisos.push("Se reabrió la paritaria: el sueldo había quedado muy atrás.");
    }
    S.ipcUltimaParitaria = S.ipc;
    S.mesesDesdeParitaria = 0;
    S.avisos.push("Cerró la paritaria: " + pct(sube) + " de aumento. La inflación del período fue " + pct(atraso) + ".");
    if(cobertura < .95) aprender("licuacion");
  }

  /* La referencia sube cuando de verdad progresás (un ascenso, un curso, cambiar
     de laburo) y se afloja de a poco si te quedás quieto. Es lo que hace que un
     paso atrás en la carrera pese, sin condenarte para siempre. */
  S.sueldoObjetivo = Math.max(S.sueldoObjetivo * .999, (S.sueldo / S.ipc) * .95);

  // --- ingresos ---
  if(S.trabajo){
    cobrar(S.sueldo, "Sueldo");
    S.sinTrabajo = 0;
    const m = fechaMes();
    if(m === 5 || m === 11) cobrar(S.sueldo / 2, "Medio aguinaldo");
  } else {
    S.sinTrabajo++;
  }

  // --- egresos fijos ---
  gastar(S.gastos, "Gastos del mes");
  if(S.cuotas.length){
    const c = cuotasMes();
    gastar(c, "Cuotas (" + S.cuotas.length + ")");
    S.cuotas.forEach(x => x.restantes--);
    const term = S.cuotas.filter(x => x.restantes <= 0);
    term.forEach(x => S.avisos.push("Terminaste de pagar: " + x.desc + "."));
    S.cuotas = S.cuotas.filter(x => x.restantes > 0);
  }

  moverMercados(R);

  // --- rendimientos y deuda ---
  if(S.plazo > 0){
    const t = tasaPF();
    S.ultimaTasaPF = t;
    S.plazo *= (1 + t); S.plazoMeses++;
    // La lección aparece el día que la tasa le pierde a la inflación, no antes.
    if(t < S.inflMes && S.plazoMeses > 2) aprender("tasaReal");
  }
  if(S.pesos > S.gastos * 3 && S.inflMes > .02) aprender("costoOport");
  if(S.deuda > 0){
    const i = S.deuda * tasaDeuda();
    S.deuda += i;
    if(S.deuda > S.sueldo) aprender("interesComp");
    S.detalle.push(["Intereses de la tarjeta", -i]);
    S.egMes += i;
    // pago automático si hay con qué: primero la deuda cara
    if(S.pesos > S.deuda){ S.pesos -= S.deuda; S.avisos.push("Cancelaste la tarjeta: " + fmt(S.deuda) + "."); S.deuda = 0; }
    else if(S.pesos > 0 && S.deuda > S.gastos * 2){
      const p = S.pesos * .5; S.pesos -= p; S.deuda -= p;
      S.avisos.push("Pagaste " + fmt(p) + " de tarjeta para que no siga creciendo.");
    }
    // Si el saldo pasa el límite, el banco te refinancia: sale del rojo de la
    // tarjeta y entra como cuota fija durante dos años. Alivia hoy, pesa después.
    const lim = limiteCredito();
    if(S.deuda > lim){
      const exceso = S.deuda - lim;
      S.deuda = lim;
      S.cuotas.push({ monto: exceso / 24, restantes: 24, desc: "Refinanciación de tarjeta" });
      animo(-4);
      S.avisos.push("Te refinanciaron " + fmt(exceso) + " de tarjeta en 24 cuotas. Ya no te dan más crédito.");
    }
  }
  S.picoDeuda = Math.max(S.picoDeuda, S.deuda);
  if(S.deuda > 0) S.mesesEnRojo++;

  // --- logros que se ganan viviendo, no eligiendo ---
  if(aire() >= 6) lograr("primerColchon");
  if(S.regimen === "crisis" && S.deuda === 0 && S.mes > 12) lograr("sobreviviente");

  /* --- ánimo ---
     Baja sola cuando no hay margen y sube sola cuando lo hay, pero despacio:
     lo que de verdad la mueve son las decisiones. Si el desgaste pasivo pesara
     más que lo que elegís, daría lo mismo elegir. */
  const a = aire();
  animo(a < 0 ? -2.6 : a < 1 ? -1.1 : a < 3 ? -.15 : .45);
  if(S.deuda > S.sueldo) animo(-1.1);
  if(!S.trabajo) animo(-2.2);
  S.animoSuma += S.animo; S.animoN++;
  S.animoCero = S.animo <= 2 ? S.animoCero + 1 : 0;

  // --- despido aleatorio ---
  if(S.trabajo && S.mes > 8 && Math.random() < R.pDespido){
    S.trabajo = null;
    S.avisos.push("Te desvincularon. Te pagan una indemnización y a partir del mes que viene no entra más nada.");
    cobrar(S.sueldo * rndI(2,5), "Indemnización");
    animo(-9);
  }

  // --- carteras sombra: MISMO flujo de caja, tres estrategias ---
  const neto = S.inMes - S.egMes;
  S.aporteTotal += Math.max(0, neto);
  S.simPesos += neto;
  S.simPlazo = S.simPlazo * (1 + tasaPF()) + neto;
  S.simUsd += neto / S.dolar;
  S.simIndice += neto / S.dolar / S.indicePrecio;   // en unidades del índice

  guardar();
}

    { txt:"Entrar con casi todo",

          return `<p>Cobrás cuatro meses. Al quinto, cuando estabas por poner más, dejan de

        return `<p>Cobrás dos meses. Al tercero el tipo "está de viaje". Al cuarto el grupo de

  id:"vender-cosas", repetible:true, peso:1, cond: () => S.mes > 24,
  texto: () => `<p>Mirás el placard y el balcón. Hay cosas que no usás hace años.</p>`,
  opciones: [
    { txt:"Vender todo lo que no usás",
      hacer(){ cobrar(S.sueldo*rnd(.2,.5),"Venta de usados"); animo(2);
        return `<p>Dos fines de semana de fotos, mensajes y gente que pregunta y no viene.</p>
        <p>Entra algo de plata y se libera espacio. No te va a cambiar la vida, pero es de las
        pocas veces que recuperás algo de lo que gastaste.</p>`; } },
    { txt:"Regalarlo",
      hacer(){ animo(4);
        return `<p>Llenás dos bolsas y las llevás a una parroquia del barrio.</p>
        <p>No entra un peso y salís de ahí mejor que si hubieras vendido todo.</p>`; } },
  ]
},
];

/* ==========================================================================
   MOTOR DE JUEGO
   ========================================================================== */
let pendientes = [];    // resúmenes de meses acumulados sin escena

const ESPERA_REPETIBLE = 20;   // meses antes de que un evento de la diaria vuelva

function escenaDisponible(){
  // 0) dos cosas tapan cualquier otra: quedarte sin laburo y el bajón anímico
  const urgentes = [
    { id:"eleccion",         listo: () => !!S.eleccionPendiente,           espera: 2 },
    { id:"volver-a-laburar", listo: () => !S.trabajo && S.sinTrabajo >= 2, espera: 5 },
    { id:"bajon",            listo: () => S.animo < 22,                    espera: 5 },
    { id:"pre-eleccion",     listo: () => S.aEleccion <= 4 && S.aEleccion > 0 && S.mes > 8,
      espera: 40 },
  ];
  for(const u of urgentes){
    if(!u.listo()) continue;
    const visto = S.usados[u.id];
    if(visto == null || S.mes - visto >= u.espera) return EVENTOS.find(e => e.id === u.id);
  }
  // 1) hitos, en orden
  for(const h of HITOS){
    if(S.usados[h.id] != null) continue;
    if(S.mes < h.mes) continue;
    if(h.cond && !h.cond()) continue;
    return h;
  }
  // 2) eventos al azar
  if(Math.random() < .55){
    const elegibles = EVENTOS.filter(e => {
      const visto = S.usados[e.id];
      if(visto != null && !(e.repetible && S.mes - visto >= ESPERA_REPETIBLE)) return false;
      return !e.cond || e.cond();
    });
    if(elegibles.length){
      const bolsa = [];
      elegibles.forEach(e => { for(let i = 0; i < (e.peso || 1); i++) bolsa.push(e); });
      return pick(bolsa);
    }
  }
  return null;
}

/* Tres formas de que la década se corte antes de tiempo. No son castigos por
   jugar mal: son las cosas que de verdad terminan una etapa. Todas avisan
   varios meses antes, así que siempre hay margen para reaccionar. */
function finalTemprano(){
  if(S.animoCero >= 6)
    return { id:"quiebre", titulo:"No llegaste entero",
      texto:`<p>No fue un mes puntual. Fue medio año en el que te costaba levantarte, y hubo
      varias señales antes de esta.</p>
      <p>Un día no fuiste a trabajar y no avisaste. Tu hermana te vino a buscar y te llevó a
      la casa de tus viejos, donde te quedaste dormido doce horas.</p>
      <p>Vas a estar bien. Pero esta década se terminó acá, y no la terminó la plata: la terminó
      todo lo que fuiste postergando para poder ocuparte de la plata.</p>` };

  if(!S.trabajo && S.sinTrabajo >= 9 && S.deuda >= limiteCredito() * .85)
    return { id:"fondo", titulo:"Tocaste fondo",
      texto:`<p>Diez meses sin que entre nada y una deuda que ya nadie te refinancia.</p>
      <p>Entregás el departamento un sábado, con dos bolsos y la tele que ya casi terminabas de
      pagar. Volvés a tu cuarto de siempre, que tu vieja no tocó.</p>
      <p>No hubo una decisión que te trajo acá. Hubo una seguidilla de meses sin margen, y cuando
      no hay margen las decisiones las toma la urgencia.</p>` };

  if(S.mes > 24 && deudaTotal() > (S.trabajo ? S.sueldo : S.gastos) * 14
     && patrimonio() < 0)
    return { id:"concurso", titulo:"No daban los números",
      texto:`<p>Te sentás con alguien que sabe y hacen la cuenta completa. Con lo que entra y lo
      que se debe, no hay forma.</p>
      <p>Arreglás como se puede: cuotas eternas, algo de ayuda familiar, y una vergüenza que no
      le contás a nadie.</p>
      <p>Lo que se llevó todo no fue un gasto grande. Fueron los intereses, que trabajan todos
      los días y no se toman vacaciones.</p>` };
  return null;
}

function siguiente(){
  for(;;){
    if(S.mes >= DURACION){ return pantallaFinal(); }
    avanzarMes();
    const corte = finalTemprano();
    if(corte){ S.finTemprano = corte; return pantallaFinal(); }
    if(tocaRevision()){ pendientes.push(resumenMes()); return pantallaCartera(); }
    pendientes.push(resumenMes());
    const esc = escenaDisponible();
    if(esc){ S.usados[esc.id] = S.mes; return pantallaEscena(esc); }
    if(pendientes.length >= 3) return pantallaInterludio();
  }
}

function resumenMes(){
  return {
    mes: fechaMes(), anio: fechaAnio(),
    detalle: S.detalle.slice(), avisos: S.avisos.slice(),
    infl: S.inflMes, dolar: S.dolar, neto: S.inMes - S.egMes,
    // Cuánto se movió tu plata guardada contra cuánto se movieron los precios.
    // El número solo no dice nada; la resta sí.
    tasa: S.plazo > 0 ? S.ultimaTasaPF : null,
    tcr: S.tcr,
  };
}

const $hud = document.getElementById("hud");

        ${S.plazo > 0 ? `<span class="chip"><span class="lbl">Plazo fijo</span><b>${fmtK(S.plazo)}</b></span>` : ""}

        <span class="animo-lbl">Ánimo</span>

function bloqueResumenes(){
  if(!pendientes.length) return "";
  const filas = [];
  pendientes.forEach(r => {
    const nombre = MESES_NOMBRE[r.mes] + " " + String(r.anio).slice(2);
    r.detalle.forEach(([d,v]) => filas.push(
      `<div class="mes-linea"><span>${nombre} · ${d}</span>
       <span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : "−"}${fmt(Math.abs(v))}</span></div>`));
  });
  const neto = pendientes.reduce((a,r) => a + r.neto, 0);
  const ultima = pendientes[pendientes.length - 1];
  const avisos = pendientes.flatMap(r => r.avisos);
  const rotulo = pendientes.length === 1
    ? MESES_NOMBRE[ultima.mes] + " de " + ultima.anio
    : "Pasaron " + pendientes.length + " meses";
  return `
    <div class="card tenue">
      <div class="eyebrow gris">${rotulo}</div>
      ${filas.join("")}
      <div class="mes-linea total"><span>Te quedó</span>
        <span class="${neto >= 0 ? "pos" : "neg"}">${neto >= 0 ? "+" : "−"}${fmt(Math.abs(neto))}</span></div>
      <div class="mes-linea" style="margin-top:8px">
        <span>Inflación del mes</span><span>${pct(ultima.infl)}</span></div>
      <div class="mes-linea"><span>Dólar</span><span>${fmt(ultima.dolar)}</span></div>
      ${ultima.tasa != null ? `<div class="mes-linea">
        <span>Tu plazo fijo rindió</span>
        <span class="${ultima.tasa >= ultima.infl ? "pos" : "neg"}">${pct(ultima.tasa)}
        · ${ultima.tasa >= ultima.infl ? "+" : "−"}${pct(Math.abs(ultima.tasa - ultima.infl))} real</span>
      </div>` : ""}
      ${avisos.map(a => `<div class="aviso">${a}</div>`).join("")}
    </div>`;
}

/* ==========================================================================
   REVISIÓN ANUAL
   Una vez por año de juego. Es el único momento donde ves toda tu plata junta y
   podés decidir cómo repartirla. Diez momentos en toda la partida — a propósito:
   si pudieras tocar la cartera todos los meses, esto sería un simulador de
   trading, que es exactamente lo que no queremos enseñar.
   ========================================================================== */
let objetivoCartera = null;

function tocaRevision(){
  if(S.mes < 12 || S.mes % 12 !== 0) return false;
  if(S.ultimaRevision === S.mes) return false;
  if(rubrosAbiertos().length < 2) return false;
  return totalCartera() > egresoFijo() * .5;
}

function pantallaCartera(){
  pintarHud();
  const abiertos = rubrosAbiertos();
  const total = totalCartera(), v = valores();
  if(!objetivoCartera){
    objetivoCartera = {};
    // Arranca mostrando cómo estás parado hoy, no una propuesta nuestra.
    abiertos.forEach(r => objetivoCartera[r.id] = total > 0 ? Math.round(v[r.id] / total * 100) : 0);
    const dif = 100 - Object.values(objetivoCartera).reduce((a,b) => a + b, 0);
    objetivoCartera[abiertos[0].id] += dif;
  }
  const suma = Object.values(objetivoCartera).reduce((a,b) => a + b, 0);

  $app.innerHTML = `<div class="fade">
    <div class="eyebrow">Cierre del año ${Math.floor(S.mes/12)} · ${fechaAnio()}</div>
    <h2>Toda tu plata, junta</h2>
    <p class="texto" style="font-size:15px; color:var(--muted); margin:0 0 18px">
      Tenés ${fmt(total)}. Una vez por año podés reacomodar cómo está repartida.
      Mover plata paga comisión, así que rebalancear por rebalancear cuesta.</p>

    <div class="card">
      ${abiertos.map(r => {
        const pctActual = total > 0 ? v[r.id] / total * 100 : 0;
        const obj = objetivoCartera[r.id] || 0;
        return `<div class="rubro">
          <div class="rubro-cab">
            <span class="rubro-n">${r.n}</span>
            <span class="rubro-v">${fmtK(v[r.id])} <span class="rubro-hoy">hoy ${Math.round(pctActual)}%</span></span>
          </div>
          <div class="rubro-ctrl">
            <button class="paso" data-r="${r.id}" data-d="-5" ${obj <= 0 ? "disabled" : ""}>−</button>
            <div class="rubro-barra"><i style="width:${obj}%"></i></div>
            <span class="rubro-pct">${obj}%</span>
            <button class="paso" data-r="${r.id}" data-d="5" ${suma >= 100 ? "disabled" : ""}>+</button>
          </div>
        </div>`;
      }).join("")}
      <div class="rubro-total ${suma === 100 ? "ok" : "mal"}">
        ${suma === 100
          ? "Repartido: 100% · bajá algo para poder subir otra cosa"
          : "Te falta repartir " + (100 - suma) + "%"}
      </div>
    </div>

    <div class="ops">
      <button class="btn" id="aplicar" ${suma !== 100 ? "disabled" : ""}>Aplicar y seguir</button>
      <button class="btn ghost" id="saltar">Dejar todo como está</button>
    </div>
    <p class="nota">La plata en pesos y en plazo fijo es la que podés usar mañana. El bono y el
      índice pueden valer mucho y no servirte el martes que se rompe algo.</p>
  </div>`;

  $app.querySelectorAll(".paso").forEach(b => {
    b.onclick = () => {
      const r = b.dataset.r, d = +b.dataset.d;
      const s = Object.values(objetivoCartera).reduce((a,x) => a + x, 0);
      objetivoCartera[r] = clamp((objetivoCartera[r] || 0) + d, 0,
                                 (objetivoCartera[r] || 0) + (100 - s));
      pantallaCartera();
    };
  });
  document.getElementById("saltar").onclick = () => {
    S.ultimaRevision = S.mes; objetivoCartera = null; aprender("horizonte"); siguiente();
  };
  const ap = document.getElementById("aplicar");
  if(ap) ap.onclick = () => {
    const movido = rebalancear(objetivoCartera);
    const usados = Object.values(objetivoCartera).filter(x => x >= 10).length;
    if(usados >= 3) aprender("diversif");
    if(Object.values(objetivoCartera).some(x => x >= 80)) aprender("concentr");
    S.ultimaRevision = S.mes; objetivoCartera = null;
    guardar();
    pantallaConsecuencia("Reacomodaste la cartera",
      movido > 0
        ? `<p>Moviste ${fmt(movido)} entre una cosa y otra.</p>
           <p>Las comisiones ya se descontaron. No se sienten de a una; a diez años de
           rebalanceos, sí.</p>`
        : `<p>Hiciste los números y quedó casi igual a como estaba.</p>
           <p>Que es, la mayoría de las veces, la respuesta correcta.</p>`);
  };
}

function pantallaInterludio(){
  pintarHud();
  const frases = ["Los meses tranquilos también cuentan.","No pasó nada. Eso, a veces, es una buena noticia.",
    "Rutina. Trabajo, súper, domingo.","La vida sigue, más cara que el mes pasado."];
  const desbloq = bloqueDesbloqueos();
  $app.innerHTML = `<div class="fade">
    ${bloqueResumenes()}
    ${desbloq}
    <p class="texto" style="color:var(--dim); font-style:italic; margin:0 0 16px">${pick(frases)}</p>
    <button class="btn" id="seguir">Seguir</button></div>`;
  pendientes = [];
  document.getElementById("seguir").onclick = siguiente;
}

function pantallaEscena(esc){
  pintarHud();
  const ops = esc.opciones.filter(o => !o.cond || o.cond());
  const desbloq = bloqueDesbloqueos();
  $app.innerHTML = `<div class="fade">
    ${bloqueResumenes()}
    ${desbloq}
    <div class="card">
      <div class="texto serif">${esc.texto()}</div>
    </div>
    <div class="ops">
      ${ops.map((o,i) => `<button class="op" data-i="${i}">${o.txt}
        ${o.sub ? `<span class="sub">${o.sub}</span>` : ""}</button>`).join("")}
    </div></div>`;
  pendientes = [];
  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => {
      const o = ops[+b.dataset.i];
      const txt = o.hacer() || "";
      guardar();
      pantallaConsecuencia(o.txt, txt);
    };
  });
}

/* Lo desbloqueado se muestra después de la consecuencia, nunca antes: primero
   te pasa la cosa, y recién entonces se te nombra lo que acabás de vivir. */
function bloqueDesbloqueos(){
  if(!S.nuevos.length) return "";
  const html = S.nuevos.map(d => {
    if(d.tipo === "concepto"){
      const c = CONCEPTOS[d.id];
      return `<div class="desbloqueo"><span class="ico">◆</span><div>
        <div class="cab">Aprendiste</div><div class="ttl">${c.n}</div>
        <div class="cpo">${c.t}</div></div></div>`;
    }
    if(d.tipo === "instrumento"){
      const e = ESCALERA.find(x => x.id === d.id);
      return `<div class="desbloqueo nuevo-instr"><span class="ico">▲</span><div>
        <div class="cab">Se te abrió una puerta</div><div class="ttl">${e.n}</div>
        <div class="cpo">${e.d}</div>
        <div class="cpo" style="color:var(--dim); margin-top:7px">Se habilitó porque juntaste
        ${e.aire === .5 ? "medio mes" : e.aire + " meses"} de gastos en plata disponible.</div>
      </div></div>`;
    }
    const l = LOGROS[d.id];
    return `<div class="desbloqueo"><span class="ico">★</span><div>
      <div class="cab">Logro</div><div class="ttl">${l.n}</div>
      <div class="cpo">${l.d}.</div></div></div>`;
  }).join("");
  S.nuevos = [];
  return html;
}

function pantallaConsecuencia(elegido, txt){
  pintarHud();
  $app.innerHTML = `<div class="fade">
    <div class="card">
      <div class="eyebrow">Elegiste: ${elegido.toLowerCase()}</div>
      <div class="conseq serif">${txt}</div>
    </div>
    ${S.avisos.length ? S.avisos.map(a => `<div class="aviso" style="margin-bottom:14px">${a}</div>`).join("") : ""}
    ${bloqueDesbloqueos()}
    <button class="btn" id="seguir">Seguir</button></div>`;
  S.avisos = [];
  document.getElementById("seguir").onclick = siguiente;
}

/* ==========================================================================
   FINAL
   ========================================================================== */
function pantallaFinal(){
  $hud.innerHTML = "";   // la partida terminó: los números del HUD ya no dicen nada
  const patrUsd  = patrimonio() / S.dolar;
  const a        = aire();
  const animoProm = S.animoN ? S.animoSuma / S.animoN : 50;

  const simPesosUsd = S.simPesos / S.dolar;
  const simPlazoUsd = S.simPlazo / S.dolar;
  const simUsdUsd   = S.simUsd;
  const simIndiceUsd = S.simIndice * S.indicePrecio;
  const maxSim = Math.max(patrUsd, simPesosUsd, simPlazoUsd, simUsdUsd, simIndiceUsd, 1);

  // --- logros que solo se pueden juzgar al final ---
  if(S.mesesEnRojo === 0) lograr("sinDeuda");
  if(animoProm >= 75) lograr("vividor");
  if(S.pesos > 0 && S.usd > 0 && S.plazo > 0) lograr("repartido");
  if(S.usados["volver-a-laburar"] != null && S.deuda === 0) lograr("aguante");

  // epílogo según cómo llegaste
  let titulo, epilogo;
  if(S.finTemprano){
    titulo = S.finTemprano.titulo;
    epilogo = S.finTemprano.texto;
  } else if(a >= 24 && animoProm >= 58){
    titulo = "Llegaste con aire";
    epilogo = `<p>Treinta y dos años. Si mañana se corta todo, tenés ${a.toFixed(0)} meses para
    resolverlo sin pedirle nada a nadie.</p><p>No sos rico. Sos otra cosa, que se nota menos y
    vale más: sos alguien que puede decir que no.</p>`;
  } else if(a >= 24){
    titulo = "Llegaste con plata y cansado";
    // El motivo del desgaste cambia según cómo fue la década: no es lo mismo
    // haberla pasado mal debiendo que haberla pasado mal privándose.
    epilogo = S.mesesEnRojo > 24
      ? `<p>Los números cerraron: ${a.toFixed(0)} meses de aire, más de lo que tiene casi todo
         el mundo.</p><p>Pero fueron ${S.mesesEnRojo} meses con una deuda encima. Ese ruido de
         fondo, el de revisar el resumen antes de dormir, no aparece en ninguna planilla y te
         estuvo cobrando todos los días.</p>`
      : `<p>Los números cerraron: ${a.toFixed(0)} meses de aire, más de lo que tiene casi todo
         el mundo.</p><p>Pero mirá para atrás y fijate cuántas veces dijiste "ahora no". La plata
         era para algo. Guardarla no era el objetivo, era el medio, y en algún momento de esta
         década se te dieron vuelta los dos.</p>`;
  } else if(a >= 9){
    titulo = "Llegaste parado";
    epilogo = `<p>No es una fortuna, pero tenés ${a.toFixed(1).replace(".",",")} meses de aire y
    ninguna deuda que te desvele.</p><p>Es más de lo que suena. La mayoría de la gente termina
    esta década sin margen ninguno.</p>`;
  } else if(S.deuda > S.sueldo * 3){
    titulo = "Llegaste debiendo";
    epilogo = `<p>Debés ${fmt(S.deuda)}, que son varios sueldos tuyos.</p>
    <p>No pasó de golpe. Fue un mes que no cerró, y después otro, y el interés haciendo lo suyo
    en silencio. La deuda cara es lo único que crece más rápido que la inflación.</p>`;
  } else {
    titulo = "Llegaste justo";
    epilogo = `<p>Vas mes a mes. Si se rompe algo grande, no sabés de dónde sale.</p>
    <p>No te fue mal, exactamente. Es que nunca hubo margen, y sin margen todas las decisiones
    las toma la urgencia.</p>`;
  }

  const barra = v => `<div class="barra"><i style="width:${clamp(v/maxSim*100,0,100)}%"></i></div>`;

  // Lo aprendido, en el orden en que fue pasando; lo que falta, como invitación.
  const entradas = Object.entries(CONCEPTOS);
  const aprendidos = entradas.filter(([id]) => S.conceptos[id] != null)
                             .sort((x,y) => S.conceptos[x[0]] - S.conceptos[y[0]]);
  const faltantes  = entradas.filter(([id]) => S.conceptos[id] == null);
  const nAprendidos = aprendidos.length, totalConceptos = entradas.length;
  const logrados = Object.entries(LOGROS).filter(([id]) => S.logros[id] != null);

  $app.innerHTML = `<div class="fade">
    <div class="eyebrow">${S.finTemprano
      ? "Año " + (Math.floor(S.mes/12)+1) + " de 10 · " + S.edad + " años"
      : "Diez años después · " + S.edad + " años"}</div>
    <h1>${titulo}</h1>
    <div class="texto serif">${epilogo}</div>

    <div class="stat-grid">
      <div class="stat"><div class="n" style="color:${a<3?"var(--rojo)":a>=12?"var(--verde)":"var(--oro)"}">
        ${aireTexto(a)}</div>
        <div class="l">meses de aire<br>(cuánto aguantás sin ingresos)</div></div>
      <div class="stat"><div class="n">${usd(patrUsd)}</div>
        <div class="l">patrimonio, medido en dólares</div></div>
      <div class="stat"><div class="n">${Math.round(animoProm)}</div>
        <div class="l">ánimo promedio de la década</div></div>
      <div class="stat"><div class="n" style="color:${S.mesesEnRojo>24?"var(--rojo)":"inherit"}">
        ${S.mesesEnRojo}</div><div class="l">meses con deuda encima</div></div>
    </div>

    <hr class="sep">
    <div class="eyebrow">Con tu mismo flujo de plata</div>
    <p class="texto" style="font-size:15px; color:var(--muted); margin-bottom:12px">
      Todo lo que te sobró cada mes, si en lugar de lo que hiciste lo hubieras puesto siempre
      en el mismo lugar. Mismo sueldo, mismos gastos, mismas decisiones de vida.</p>
    <div class="card">
      <div class="comp yo"><span class="nom">Lo que hiciste vos</span>${barra(patrUsd)}
        <span class="val">${usd(patrUsd)}</span></div>
      <div class="comp"><span class="nom">Todo en pesos, quieto</span>${barra(simPesosUsd)}
        <span class="val">${usd(simPesosUsd)}</span></div>
      <div class="comp"><span class="nom">Todo a plazo fijo</span>${barra(simPlazoUsd)}
        <span class="val">${usd(simPlazoUsd)}</span></div>
      <div class="comp"><span class="nom">Todo a dólares</span>${barra(simUsdUsd)}
        <span class="val">${usd(simUsdUsd)}</span></div>
      <div class="comp"><span class="nom">Todo al índice global</span>${barra(simIndiceUsd)}
        <span class="val">${usd(simIndiceUsd)}</span></div>
    </div>
    <p class="nota">Te tocó un país con estos regímenes: la inflación acumulada de la década fue
      ${pct(S.ipc - 1)}, el dólar pasó de $1.350 a ${fmt(S.dolar)}, hubo ${S.elecciones}
      ${S.elecciones === 1 ? "elección" : "elecciones"} y el índice global multiplicó por
      ${(S.indicePrecio/100).toFixed(2).replace(".",",")}. En otra partida te toca otro
      país. Esa es la idea: si hubiera una jugada que gana siempre, no habría nada que aprender.</p>

    <hr class="sep">
    <div class="eyebrow">Lo que aprendiste · ${nAprendidos} de ${totalConceptos}</div>
    <p class="texto" style="font-size:15px; color:var(--muted); margin-bottom:12px">
      Cada idea se desbloqueó el mes que te pasó. Las que te faltan no están escondidas:
      aparecen si tomás otras decisiones.</p>
    ${aprendidos.map(([id,c]) => `<div class="card concepto">
        <div class="concepto-n">${c.n}</div>
        <div class="concepto-t">${c.t}</div></div>`).join("")}
    ${faltantes.length ? `<div class="card tenue">
        <div class="eyebrow gris">Todavía no te pasaron</div>
        <div class="pendientes">${faltantes.map(([id,c]) =>
          `<span class="pendiente">${c.n}</span>`).join("")}</div></div>` : ""}

    <hr class="sep">
    <div class="eyebrow">Logros · ${logrados.length} de ${Object.keys(LOGROS).length}</div>
    <div class="card">
      ${logrados.length
        ? logrados.map(([id,l]) => `<div class="logro"><span class="logro-tic">◆</span>
            <span><b>${l.n}</b><span class="logro-d">${l.d}</span></span></div>`).join("")
        : `<p class="texto" style="font-size:15px; color:var(--muted); margin:0">
             Ninguno esta vez. Están puestos en las cosas difíciles de sostener diez años.</p>`}
    </div>

    <hr class="sep">
    <div class="eyebrow gris">Tu década</div>
    <div class="card tenue">
      ${S.historia.map(h => `<div class="mes-linea"><span>Año ${Math.floor(h.mes/12)+1}</span>
        <span style="text-align:right; color:var(--text)">${h.t}</span></div>`).join("")}
      ${S.golpes || S.suertes ? `<div class="mes-linea" style="margin-top:8px">
        <span>El azar</span><span style="text-align:right; color:var(--text)">
        ${S.golpes} ${S.golpes === 1 ? "golpe" : "golpes"} y
        ${S.suertes} ${S.suertes === 1 ? "guiñada" : "guiñadas"}</span></div>` : ""}
    </div>

    <button class="btn" id="otra" style="margin-top:20px">Jugar otra vida</button>
    <p class="nota">Esto es un juego. Los números son verosímiles, no son un pronóstico,
      y nada de acá es asesoramiento financiero.</p>
  </div>`;
  borrarGuardado();
  document.getElementById("otra").onclick = pantallaInicio;
}

/* ==========================================================================
   INICIO
   ========================================================================== */
function pantallaInicio(){
  S = null; pendientes = []; pintarHud();
  const guardada = hayGuardado();
  $app.innerHTML = `<div class="fade" style="padding-top:44px">
    <div class="eyebrow">Un juego de decisiones</div>
    <h1 class="serif">Fin de Mes</h1>
    <div class="texto serif" style="margin-bottom:26px">
      <p>Tenés veintidós años y acabás de conseguir tu primer trabajo en blanco.</p>
      <p>Lo que sigue son diez años: sueldos que llegan tarde, precios que llegan temprano,
      y un montón de decisiones chicas que de a una no parecen nada.</p>
      <p><em>No hay respuestas correctas. Hay consecuencias.</em></p>
    </div>
    <div class="eyebrow gris">¿De dónde arrancás?</div>
    <div class="ops">
      ${ORIGENES.map((o,i) => `<button class="op" data-i="${i}">${o.titulo}
        <span class="sub">${o.sub}</span></button>`).join("")}
    </div>
    ${guardada ? `<button class="btn ghost" id="seguirPartida" style="margin-top:16px">Seguir la partida anterior</button>` : ""}
    <p class="nota">Los precios, los sueldos y la inflación son inventados pero verosímiles.
      El país que te toca se sortea al empezar y cambia sin avisar, como el de verdad.</p>
  </div>`;

  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => { nuevaPartida(ORIGENES[+b.dataset.i]); siguiente(); };
  });
  const sp = document.getElementById("seguirPartida");
  if(sp) sp.onclick = () => { if(cargar()) siguiente(); };
}

/* ---------- persistencia ----------
   Safari en modo privado y algunos iframes tiran excepción al tocar localStorage.
   Si pasa, el juego tiene que seguir andando: se pierde el guardado, nada más. */
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
function hayGuardado(){ try{ return !!localStorage.getItem(CLAVE); }catch(e){ return false; } }
function borrarGuardado(){ try{ localStorage.removeItem(CLAVE); }catch(e){} }
function cargar(){
  try{ const r = localStorage.getItem(CLAVE); if(!r) return false; S = JSON.parse(r); return true; }
  catch(e){ return false; }
}

pantallaInicio();
</script>
</body>
</html>
