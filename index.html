function bloqueResumenes(){
  if(!pendientes.length) return "";
  const filas = [];
  pendientes.forEach(r => {
    const nombre = MESES_NOMBRE[r.mes] + " " + String(r.anio).slice(2);
    r.detalle.forEach(([d,v]) => filas.push(
      `<div class="mes-linea"><span>${nombre} · ${d}</span>
       <span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : "−"}${fmt(Math.abs(v))}</span></div>`));
  });
  const neto = pendientes.reduce((a,r) => a + r.neto, 0);
  const ultima = pendientes[pendientes.length - 1];
  const avisos = pendientes.flatMap(r => r.avisos);
  const rotulo = pendientes.length === 1
    ? MESES_NOMBRE[ultima.mes] + " de " + ultima.anio
    : "Pasaron " + pendientes.length + " meses";
  const cuerpo = `
      ${filas.join("")}
      <div class="mes-linea total"><span>Te quedó</span>
        <span class="${neto >= 0 ? "pos" : "neg"}">${neto >= 0 ? "+" : "−"}${fmt(Math.abs(neto))}</span></div>
      <div class="mes-linea" style="margin-top:8px">
        <span>Inflación del mes</span><span>${pct(ultima.infl)}</span></div>
      <div class="mes-linea"><span>Dólar</span><span>${fmt(ultima.dolar)}</span></div>
      ${ultima.tasa != null ? `<div class="mes-linea">
        <span>Tu plazo fijo rindió</span>
        <span class="${ultima.tasa >= ultima.infl ? "pos" : "neg"}">${pct(ultima.tasa)}
        · ${ultima.tasa >= ultima.infl ? "+" : "−"}${pct(Math.abs(ultima.tasa - ultima.infl))} real</span>
      </div>` : ""}
      ${avisos.map(a => `<div class="aviso">${a}</div>`).join("")}`;

  /* El cierre de mes es donde se aprende a ver la licuación, así que los
     primeros meses va entero. Después el jugador ya lo sabe leer y son seis
     renglones iguales arriba de cada decisión: se compacta en una línea y se
     abre tocándolo. Sigue apareciendo entero solo cuando hay algo distinto que
     mirar — un aviso, una fila fuera de lo habitual, o el plazo fijo contra la
     inflación, que es justamente la comparación que enseña. */
  const habituales = pendientes.length * 2;
  const valeLaPena = avisos.length || ultima.tasa != null || filas.length > habituales;
  if(S.mes <= 6 || valeLaPena)
    return `<div class="card tenue"><div class="eyebrow gris">${rotulo}</div>${cuerpo}</div>`;

  return `
    <details class="card tenue mes-plegado">
      <summary>
        <span class="eyebrow gris">${rotulo}</span>
        <span class="mes-resumen">te quedó
          <b class="${neto >= 0 ? "pos" : "neg"}">${neto >= 0 ? "+" : "−"}${fmt(Math.abs(neto))}</b>
          · inflación ${pct(ultima.infl)}</span>
      </summary>
      ${cuerpo}
    </details>`;
}

/* ==========================================================================
   REVISIÓN ANUAL
   Una vez por año de juego. Es el único momento donde ves toda tu plata junta y
   podés decidir cómo repartirla. Diez momentos en toda la partida — a propósito:
   si pudieras tocar la cartera todos los meses, esto sería un simulador de
   trading, que es exactamente lo que no queremos enseñar.
   ========================================================================== */
let objetivoCartera = null;

function tocaRevision(){
  if(S.mes < 12 || S.mes % 12 !== 0) return false;
  if(S.ultimaRevision === S.mes) return false;
  if(rubrosAbiertos().length < 2) return false;
  return totalCartera() > egresoFijo() * .5;
}

function pantallaCartera(){
  pintarHud();
  const abiertos = rubrosAbiertos();
  const total = totalCartera(), v = valores();
  const rend = rendimientoAnual();

  /* Veredicto del pronóstico del año pasado. Se resuelve acá, en la misma
     pantalla donde vas a volver a arriesgar: la lección se siente más cuando el
     error todavía está caliente y tenés que decidir de nuevo igual. */
  let veredicto = "";
  if(S.pronostico && rend){
    const gano = ganadorDelAnio();
    const acerto = gano === S.pronostico.elegido;
    S.pronosticos.push({ mes: S.mes, elegido: S.pronostico.elegido, gano, acerto });
    if(acerto) lograr("adivino");
    veredicto = `<div class="veredicto ${acerto ? "bien" : "mal"}">
      <div class="veredicto-cab">${acerto ? "Le acertaste" : "No la viste venir"}</div>
      <div class="veredicto-cpo">Hace un año apostaste a <b>${nombreRubro(S.pronostico.elegido)}</b>
        y el que más rindió fue <b>${nombreRubro(gano)}</b>${acerto ? "." : ", con "
        + (rend[gano]*100).toFixed(1).replace(".",",") + "% real contra "
        + (rend[S.pronostico.elegido]*100).toFixed(1).replace(".",",") + "% del tuyo."}
        ${S.pronosticos.length >= 3
          ? "Llevás " + S.pronosticos.filter(x => x.acerto).length + " de "
            + S.pronosticos.length + " pronósticos."
          : ""}</div>
    </div>`;
    S.pronostico = null;
  }
  if(!objetivoCartera){
    objetivoCartera = {};
    // Arranca mostrando cómo estás parado hoy, no una propuesta nuestra.
    abiertos.forEach(r => objetivoCartera[r.id] = total > 0 ? Math.round(v[r.id] / total * 100) : 0);
    const dif = 100 - Object.values(objetivoCartera).reduce((a,b) => a + b, 0);
    objetivoCartera[abiertos[0].id] += dif;
  }
  const suma = Object.values(objetivoCartera).reduce((a,b) => a + b, 0);

  $app.innerHTML = `<div class="fade">
    <div class="eyebrow">Cierre del año ${Math.floor(S.mes/12)} · ${fechaAnio()}</div>
    <h2>Toda tu plata, junta</h2>
    <p class="texto" style="font-size:15px; color:var(--muted); margin:0 0 18px">
      Tenés ${fmt(total)}. Una vez por año podés reacomodar cómo está repartida.
      Mover plata paga comisión, así que rebalancear por rebalancear cuesta.</p>
    ${veredicto}
    ${rend ? `<p class="texto" style="font-size:14px; color:var(--dim); margin:-8px 0 16px">
      Al lado de cada uno, cuánto rindió en los últimos doce meses <b>descontada la
      inflación</b>. Un +0% significa que empataste con los precios; los pesos quietos
      siempre pierden, y esa es toda la explicación que hace falta.</p>` : ""}

    <div class="card">
      ${abiertos.map(r => {
        const pctActual = total > 0 ? v[r.id] / total * 100 : 0;
        const obj = objetivoCartera[r.id] || 0;
        const ren = rend ? rend[r.id] : null;
        return `<div class="rubro">
          <div class="rubro-cab">
            <span class="rubro-n">${r.n}
              ${ren != null ? `<span class="rubro-ren ${ren >= 0 ? "pos" : "neg"}">${
                ren >= 0 ? "+" : "−"}${(Math.abs(ren)*100).toFixed(1).replace(".",",")}% real</span>` : ""}</span>
            <span class="rubro-v">${fmtK(v[r.id])} <span class="rubro-hoy">hoy ${Math.round(pctActual)}%</span></span>
          </div>
          <div class="rubro-ctrl">
            <input type="range" class="perilla" min="0" max="100" step="1" value="${obj}"
                   style="--fill:${obj}%" data-r="${r.id}" aria-label="Porcentaje en ${r.n}">
            <span class="rubro-pct" data-pct="${r.id}">${obj}%</span>
          </div>
          <div class="rubro-monto" data-monto="${r.id}">${fmtK(total * obj / 100)}</div>
        </div>`;
      }).join("")}
      <div id="saldo" class="saldo cero">Todo repartido</div>
    </div>

    <div class="ops">
      <button class="btn" id="aplicar">Aplicar y seguir</button>
      <button class="btn ghost" id="saltar">Dejar todo como está</button>
    </div>
    <p class="nota">La plata en pesos y en plazo fijo es la que podés usar mañana. El bono y el
      índice pueden valer mucho y no servirte el martes que se rompe algo.</p>
  </div>`;

  /* Cada perilla se mueve sola. Lo que bajás queda como saldo sin asignar y lo
     ponés donde quieras — que es como se reparte plata de verdad. La versión
     anterior acomodaba las otras en proporción automáticamente, y eso te sacaba
     de las manos la decisión de a dónde iba lo que acababas de liberar.

     El tope de cada perilla es lo que ya tiene más el saldo libre, así nunca se
     pasa de 100. El DOM se actualiza en el lugar: si se redibujara la pantalla,
     el dedo perdería la perilla a mitad del arrastre. */
  const saldoLibre = () => 100 - abiertos.reduce((a, r) => a + (objetivoCartera[r.id] || 0), 0);

  function refrescarCartera(){
    const libre = saldoLibre();
    abiertos.forEach(r => {
      const pct = objetivoCartera[r.id] || 0;
      const $p = $app.querySelector(`[data-pct="${r.id}"]`);
      const $m = $app.querySelector(`[data-monto="${r.id}"]`);
      const $s = $app.querySelector(`.perilla[data-r="${r.id}"]`);
      if($p) $p.textContent = pct + "%";
      if($m) $m.textContent = fmtK(total * pct / 100);
      if($s){
        /* La escala queda siempre en 0–100 para que la misma posición signifique
           siempre lo mismo. El freno se aplica al valor, no al máximo: si
           arrastrás más allá de lo que tenés libre, la perilla vuelve sola. */
        if(+$s.value !== pct) $s.value = pct;
        $s.style.setProperty("--fill", pct + "%");
      }
    });
    const $saldo = document.getElementById("saldo");
    if($saldo){
      $saldo.className = "saldo " + (libre === 0 ? "cero" : "hay");
      $saldo.innerHTML = libre === 0
        ? "Todo repartido"
        : `Sin asignar: <b>${libre}%</b> <span class="saldo-plata">${fmtK(total * libre / 100)}</span>`;
    }
    const $ap = document.getElementById("aplicar");
    if($ap){
      $ap.disabled = libre !== 0;
      $ap.textContent = libre === 0 ? "Aplicar y seguir" : `Te falta repartir ${libre}%`;
    }
  }

  $app.querySelectorAll(".perilla").forEach(sl => {
    sl.addEventListener("input", () => {
      const id = sl.dataset.r;
      const otros = abiertos.reduce((a, r) => a + (r.id === id ? 0 : (objetivoCartera[r.id] || 0)), 0);
      objetivoCartera[id] = clamp(+sl.value, 0, 100 - otros);
      refrescarCartera();
    });
  });
  refrescarCartera();
  document.getElementById("saltar").onclick = () => {
    S.ultimaRevision = S.mes; objetivoCartera = null; aprender("horizonte");
    pantallaPronostico();
  };
  const ap = document.getElementById("aplicar");
  if(ap) ap.onclick = () => {
    const movido = rebalancear(objetivoCartera);
    const usados = Object.values(objetivoCartera).filter(x => x >= 10).length;
    if(usados >= 3) aprender("diversif");
    if(Object.values(objetivoCartera).some(x => x >= 80)) aprender("concentr");
    S.ultimaRevision = S.mes; objetivoCartera = null;
    S.movidoUltimo = movido;
    guardar();
    pantallaPronostico();
  };
}

/* ==========================================================================
   EL PRONÓSTICO
   Cierra la revisión anual pidiéndote que apuestes a qué va a rendir más. El
   veredicto llega doce meses después, arriba de la revisión siguiente.

   Es la mejor forma que encontré de enseñar que no se puede predecir: no un
   cartel diciéndolo, sino tu propio registro de aciertos al final de la década.
   Lo normal es terminar cerca de lo que daría tirar una moneda, y eso lo
   descubrís vos solo. */
function pantallaPronostico(){
  pintarHud();
  const abiertos = rubrosAbiertos().filter(r => r.id !== "pesos");
  if(abiertos.length < 2){       // sin al menos dos opciones no hay nada que arriesgar
    S.snap = fotoMercados(); return siguiente();
  }
  const movido = S.movidoUltimo || 0;
  S.movidoUltimo = 0;

  $app.innerHTML = `<div class="fade">
    ${movido > 0
      ? `<div class="card tenue"><div class="eyebrow gris">Cartera reacomodada</div>
           <div class="texto" style="font-size:15px">Moviste ${fmt(movido)} entre una cosa y
           otra. Las comisiones ya se descontaron: no se sienten de a una, a diez años sí.</div>
         </div>`
      : ""}
    <div class="eyebrow">Antes de seguir</div>
    <h2>¿Qué va a rendir más este año?</h2>
    <p class="texto" style="font-size:15px; color:var(--muted); margin:0 0 18px">
      Arriesgá una. No cambia nada de tu plata — es solo para que dentro de doce meses
      podamos mirar juntos qué tan bien la viste.</p>
    <div class="ops">
      ${abiertos.map(r => `<button class="op" data-id="${r.id}">${r.n}</button>`).join("")}
      <button class="op tenue-op" data-id="">Prefiero no arriesgar</button>
    </div>
  </div>`;

  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      if(id) S.pronostico = { mes: S.mes, elegido: id };
      S.snap = fotoMercados();
      guardar();
      siguiente();
    };
  });
}

function pantallaInterludio(){
  pintarHud();
  const frases = ["Los meses tranquilos también cuentan.","No pasó nada. Eso, a veces, es una buena noticia.",
    "Rutina. Trabajo, súper, domingo.","La vida sigue, más cara que el mes pasado."];
  const desbloq = bloqueDesbloqueos();
  $app.innerHTML = `<div class="fade">
    ${bloqueResumenes()}
    ${desbloq}
    <p class="texto" style="color:var(--dim); font-style:italic; margin:0 0 16px">${pick(frases)}</p>
    <button class="btn" id="seguir">Seguir</button></div>`;
  pendientes = [];
  document.getElementById("seguir").onclick = siguiente;
}

/* La consecuencia aparece acá mismo, debajo de la opción que elegiste, en vez de
   reemplazar la pantalla entera. Así quedan juntos el cierre del mes, la escena,
   lo que elegiste y lo que pasó — que es como se lee una historia y no una
   sucesión de tarjetas sueltas. */
function pantallaEscena(esc){
  pintarHud();
  const ops = esc.opciones.filter(o => !o.cond || o.cond());
  const desbloq = bloqueDesbloqueos();
  $app.innerHTML = `<div class="fade">
    ${bloqueResumenes()}
    ${desbloq}
    <div class="card">
      <div class="texto serif">${textoDe(esc)}</div>
    </div>
    <div class="ops" id="ops">
      ${ops.map((o,i) => `<button class="op" data-i="${i}">${o.txt}
        ${o.sub ? `<span class="sub">${o.sub}</span>` : ""}
        ${etiquetasHtml(o)}</button>`).join("")}
    </div>
    <div id="resultado"></div></div>`;
  pendientes = [];

  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => {
      const o = ops[+b.dataset.i];
      const txt = o.hacer() || "";
      guardar();

      // Las opciones no elegidas se van; la elegida queda como encabezado.
      const $ops = document.getElementById("ops");
      $ops.querySelectorAll(".op").forEach(x => {
        if(x !== b) x.remove();
      });
      b.classList.add("elegida");
      b.disabled = true;

      const avisos = S.avisos.slice(); S.avisos = [];
      document.getElementById("resultado").innerHTML = `
        <div class="conseq serif fade">${txt}</div>
        ${avisos.map(a => `<div class="aviso">${a}</div>`).join("")}
        ${bloqueDesbloqueos()}
        <button class="btn" id="seguir">Seguir</button>`;
      document.getElementById("seguir").onclick = siguiente;
      pintarHud();
      document.getElementById("resultado")
        .scrollIntoView({ behavior:"smooth", block:"nearest" });
    };
  });
}

/* Lo desbloqueado se muestra después de la consecuencia, nunca antes: primero
   te pasa la cosa, y recién entonces se te nombra lo que acabás de vivir. */
function bloqueDesbloqueos(){
  if(!S.nuevos.length) return "";
  const html = S.nuevos.map(d => {
    /* Si una escena nombra un id que no existe, se saltea la tarjeta en vez de
       romper el render: un desbloqueo que falta es un detalle, una pantalla sin
       botones es una partida perdida. */
    const tabla = d.tipo === "concepto" ? CONCEPTOS
                : d.tipo === "instrumento" ? null : LOGROS;
    if(tabla && !tabla[d.id]) return "";
    if(d.tipo === "instrumento" && !ESCALERA.some(x => x.id === d.id)) return "";
    if(d.tipo === "concepto"){
      const c = CONCEPTOS[d.id];
      return `<div class="desbloqueo"><span class="ico">◆</span><div>
        <div class="cab">Aprendiste</div><div class="ttl">${c.n}</div>
        <div class="cpo">${c.t}</div></div></div>`;
    }
    if(d.tipo === "instrumento"){
      const e = ESCALERA.find(x => x.id === d.id);
      return `<div class="desbloqueo nuevo-instr"><span class="ico">▲</span><div>
        <div class="cab">Se te abrió una puerta</div><div class="ttl">${e.n}</div>
        <div class="cpo">${e.d}</div>
        <div class="cpo" style="color:var(--dim); margin-top:7px">Se habilitó porque juntaste
        ${e.aire === .5 ? "medio mes" : e.aire + " meses"} de gastos en plata disponible.</div>
      </div></div>`;
    }
    const l = LOGROS[d.id];
    return `<div class="desbloqueo"><span class="ico">★</span><div>
      <div class="cab">Logro</div><div class="ttl">${l.n}</div>
      <div class="cpo">${l.d}.</div></div></div>`;
  }).join("");
  S.nuevos = [];
  return html;
}
/* ==========================================================================
   GRÁFICO DEL PATRIMONIO
   Una sola serie, así que no lleva leyenda: el título la nombra. Va en pesos
   constantes del primer mes — en pesos corrientes cualquier curva sube y el
   gráfico mentiría. El cero se marca aparte porque cruzarlo significa deber más
   de lo que tenés, y eso tiene que verse de un vistazo.
   ========================================================================== */
const GRAF_W = 320, GRAF_H = 132, GRAF_PL = 4, GRAF_PR = 4, GRAF_PT = 12, GRAF_PB = 4;

function graficoPatrimonio(){
  const d = S.serie;
  if(d.length < 8) return "";

  const vals = d.map(x => x.p);
  let max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  if(max === min) max = min + 1;
  const pad = (max - min) * .10;
  max += pad; min -= pad;

  const X = i => GRAF_PL + (i / (d.length - 1)) * (GRAF_W - GRAF_PL - GRAF_PR);
  const Y = v => GRAF_PT + ((max - v) / (max - min)) * (GRAF_H - GRAF_PT - GRAF_PB);

  const linea = d.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x.p).toFixed(1)}`).join("");
  const area  = linea + `L${X(d.length-1).toFixed(1)},${Y(0).toFixed(1)}`
                      + `L${X(0).toFixed(1)},${Y(0).toFixed(1)}Z`;

  // Se etiquetan el pico y el final. El resto de los puntos no, a propósito.
  let iPico = 0;
  d.forEach((x, i) => { if(x.p > d[iPico].p) iPico = i; });
  const ult = d[d.length - 1];

  const guias = [];
  for(let a = 1; a * 12 < d.length; a++){
    const x = X(a * 12).toFixed(1);
    guias.push(`<line x1="${x}" y1="${GRAF_PT}" x2="${x}" y2="${GRAF_H - GRAF_PB}"
      stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`);
  }

  return `
  <div class="graf" id="graf" data-min="${min}" data-max="${max}">
    <svg viewBox="0 0 ${GRAF_W} ${GRAF_H}" preserveAspectRatio="none" role="img"
         aria-label="Tu patrimonio mes a mes en pesos constantes: empezó en ${fmt(d[0].p)},
         llegó a un pico de ${fmt(d[iPico].p)} y terminó en ${fmt(ult.p)}.">
      <defs>
        <linearGradient id="gpat" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#d9a441" stop-opacity=".32"/>
          <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${guias.join("")}
      <path d="${area}" fill="url(#gpat)"/>
      <line x1="${GRAF_PL}" y1="${Y(0).toFixed(1)}" x2="${GRAF_W - GRAF_PR}" y2="${Y(0).toFixed(1)}"
            stroke="#645b52" stroke-width="1" stroke-dasharray="3 3"
            vector-effect="non-scaling-stroke"/>
      <path d="${linea}" fill="none" stroke="#d9a441" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${X(d.length-1).toFixed(1)}" cy="${Y(ult.p).toFixed(1)}" r="3.5"
              fill="#d9a441" stroke="#1c1815" stroke-width="2"
              vector-effect="non-scaling-stroke"/>
      <line class="graf-cruz" x1="0" y1="${GRAF_PT}" x2="0" y2="${GRAF_H - GRAF_PB}"
            stroke="#8f857a" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="graf-tip"></div>
    <div class="graf-pie">
      <span>${MESES_NOMBRE[MES_INICIAL].slice(0,3)} ${ANIO_INICIAL}</span>
      <span>pico ${fmtK(d[iPico].p)}, año ${Math.floor(d[iPico].m / 12) + 1}</span>
      <span>${MESES_NOMBRE[fechaMes()].slice(0,3)} ${fechaAnio()}</span>
    </div>
  </div>`;
}

/* Recorrer la curva con el dedo o el mouse. Sin esto el gráfico es una foto;
   con esto podés preguntarle qué tenías en cualquier mes de la década. */
function activarGrafico(){
  const cont = document.getElementById("graf");
  if(!cont) return;
  const cruz = cont.querySelector(".graf-cruz");
  const tip  = cont.querySelector(".graf-tip");
  const d = S.serie;

  const mover = ev => {
    const r = cont.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const px = clamp((cx - r.left) / r.width, 0, 1);
    const i = Math.round(px * (d.length - 1));
    const xu = GRAF_PL + (i / (d.length - 1)) * (GRAF_W - GRAF_PL - GRAF_PR);
    cruz.setAttribute("x1", xu); cruz.setAttribute("x2", xu);
    cont.classList.add("activo");
    tip.style.left = clamp(px * 100, 14, 86) + "%";
    tip.innerHTML = `<b>${fmtK(d[i].p)}</b>`
      + MESES_NOMBRE[(MES_INICIAL + d[i].m) % 12] + " "
      + (ANIO_INICIAL + Math.floor((MES_INICIAL + d[i].m) / 12));
  };
  const salir = () => cont.classList.remove("activo");
  cont.addEventListener("pointermove", mover);
  cont.addEventListener("pointerleave", salir);
  cont.addEventListener("touchmove", ev => { ev.preventDefault(); mover(ev); }, { passive:false });
  cont.addEventListener("touchend", salir);
}

/* ==========================================================================
   ARQUETIPOS
   El título con el que terminás. Se evalúan de arriba hacia abajo y gana el
   primero que da: los de arriba son los raros y específicos, los de abajo
   agarran todo lo demás. Es lo que hace que alguien mande el juego a un amigo,
   así que la gracia importa tanto como la exactitud.
   ========================================================================== */
const ARQUETIPOS = [
  { n:"El fundido", d:"Tocó fondo antes de los treinta y volvió al cuarto de siempre.",
    cond:(x) => x.corte === "fondo" },
  { n:"El quemado", d:"Llegó con la cuenta en orden y la cabeza no.",
    cond:(x) => x.corte === "quiebre" },
  { n:"El concursado", d:"Los números no daban de ninguna manera, y en algún momento hubo que decirlo.",
    cond:(x) => x.corte === "concurso" },

  { n:"El millonario infeliz", d:"Juntó como nadie y no se acuerda de un solo domingo.",
    cond:(x) => x.aire >= 18 && x.animo < 42 },
  { n:"El que vivió", d:"No juntó casi nada y tiene las mejores anécdotas de la mesa.",
    cond:(x) => x.animo >= 72 && x.aire < 6 },
  { n:"El tacaño arrepentido", d:"Dijo que no a todo y ahora tiene plata y una lista de cosas que no hizo.",
    cond:(x) => x.aire >= 12 && !S.flags.viajo && x.animo < 55 },
  { n:"El escarmentado", d:"Le pasó lo de la mesa de inversión y todavía lo cuenta en los asados.",
    cond:(x) => !!S.logros.escarmentado && x.aire < 10 },
  { n:"El colchón abajo del colchón", d:"Terminó con todo en pesos en la caja de ahorro. Todo.",
    cond:(x) => x.total > 0 && x.rep.pesos > .80 },
  { n:"El dolarizado de manual", d:"Verde, todo verde, y no quiere escuchar otra cosa.",
    cond:(x) => x.total > 0 && x.rep.dolar > .70 },
  { n:"El que le creyó al país", d:"Casi todo en bonos argentinos. Tuvo estómago.",
    cond:(x) => x.total > 0 && x.rep.bono > .55 },
  { n:"El equilibrista", d:"Repartió en todo y no ganó ninguna charla de asado. Le fue bien igual.",
    cond:(x) => x.reparto >= 4 && x.aire >= 8 },
  { n:"El adivino", d:"Le acertó a más de la mitad de sus pronósticos. Que no se le suba.",
    cond:(x) => S.pronosticos.length >= 4 && x.aciertos / S.pronosticos.length > .5 },
  { n:"El que nunca la vio", d:"Cero pronósticos acertados en diez años. Un récord difícil.",
    cond:(x) => S.pronosticos.length >= 4 && x.aciertos === 0 },
  { n:"El sobreviviente", d:"Se pasó media década debiendo y llegó al final igual.",
    cond:(x) => x.rojo >= 55 },
  { n:"El de la familia", d:"Estuvo cuando hizo falta, y eso le costó plata y no le importó.",
    cond:(x) => !!S.logros.buenPibe && x.animo >= 55 },
  { n:"El estudioso", d:"Entendió cómo funciona todo esto mejor que la mayoría.",
    cond:(x) => x.conceptos >= 17 },
  { n:"El que zafó", d:"Le pegaron de todos lados y sigue de pie.",
    cond:(x) => S.golpes >= 7 && x.aire >= 4 },
  { n:"La tortuga", d:"Nada brillante, nada estúpido, diez años seguidos. Es más difícil de lo que parece.",
    cond:(x) => x.aire >= 10 && x.animo >= 55 },
  { n:"El que llegó justo", d:"Todos los meses cerraron. Ninguno sobró.",
    cond:(x) => x.aire < 4 },
  { n:"El del montón", d:"Ni una fortuna ni un desastre: la mayoría termina más o menos así.",
    cond:() => true },
];

function arquetipo(datos){
  return ARQUETIPOS.find(a => { try { return a.cond(datos); } catch(e){ return false; } })
      || ARQUETIPOS[ARQUETIPOS.length - 1];
}

/* ==========================================================================
   FINAL
   ========================================================================== */
function pantallaFinal(){
  $hud.innerHTML = "";   // la partida terminó: los números del HUD ya no dicen nada
  const patrUsd  = patrimonio() / S.dolar;
  const a        = aire();
  const animoProm = S.animoN ? S.animoSuma / S.animoN : 50;

  const simPesosUsd = S.simPesos / S.dolar;
  const simPlazoUsd = S.simPlazo / S.dolar;
  const simUsdUsd   = S.simUsd;
  const simIndiceUsd = S.simIndice * S.indicePrecio;
  const simBonoUsd   = S.simBono * S.idxBono;
  const maxSim = Math.max(patrUsd, simPesosUsd, simPlazoUsd, simUsdUsd,
                          simIndiceUsd, simBonoUsd, 1);

  // --- logros que solo se pueden juzgar al final ---
  if(S.mesesEnRojo === 0) lograr("sinDeuda");
  if(animoProm >= 75) lograr("vividor");
  if(S.pesos > 0 && S.usd > 0 && S.plazo > 0) lograr("repartido");
  if(S.usados["volver-a-laburar"] != null && S.deuda === 0) lograr("aguante");

  // epílogo según cómo llegaste
  let titulo, epilogo;
  if(S.finTemprano){
    titulo = S.finTemprano.titulo;
    epilogo = S.finTemprano.texto;
  } else if(a >= 12 && animoProm >= 55){
    titulo = "Llegaste con aire";
    epilogo = `<p>Treinta y dos años. Si mañana se corta todo, tenés ${a.toFixed(0)} meses para
    resolverlo sin pedirle nada a nadie.</p><p>No sos rico. Sos otra cosa, que se nota menos y
    vale más: sos alguien que puede decir que no.</p>`;
  } else if(a >= 12){
    titulo = "Llegaste con plata y cansado";
    // El motivo del desgaste cambia según cómo fue la década: no es lo mismo
    // haberla pasado mal debiendo que haberla pasado mal privándose.
    epilogo = S.mesesEnRojo > 24
      ? `<p>Los números cerraron: ${a.toFixed(0)} meses de aire, más de lo que tiene casi todo
         el mundo.</p><p>Pero fueron ${S.mesesEnRojo} meses con una deuda encima. Ese ruido de
         fondo, el de revisar el resumen antes de dormir, no aparece en ninguna planilla y te
         estuvo cobrando todos los días.</p>`
      : `<p>Los números cerraron: ${a.toFixed(0)} meses de aire, más de lo que tiene casi todo
         el mundo.</p><p>Pero mirá para atrás y fijate cuántas veces dijiste "ahora no". La plata
         era para algo. Guardarla no era el objetivo, era el medio, y en algún momento de esta
         década se te dieron vuelta los dos.</p>`;
  } else if(a >= 5){
    titulo = "Llegaste parado";
    epilogo = `<p>No es una fortuna, pero tenés ${a.toFixed(1).replace(".",",")} meses de aire y
    ninguna deuda que te desvele.</p><p>Es más de lo que suena. La mayoría de la gente termina
    esta década sin margen ninguno.</p>`;
  } else if(S.deuda > S.sueldo * 3){
    titulo = "Llegaste debiendo";
    epilogo = `<p>Debés ${fmt(S.deuda)}, que son varios sueldos tuyos.</p>
    <p>No pasó de golpe. Fue un mes que no cerró, y después otro, y el interés haciendo lo suyo
    en silencio. La deuda cara es lo único que crece más rápido que la inflación.</p>`;
  } else {
    titulo = "Llegaste justo";
    epilogo = `<p>Vas mes a mes. Si se rompe algo grande, no sabés de dónde sale.</p>
    <p>No te fue mal, exactamente. Es que nunca hubo margen, y sin margen todas las decisiones
    las toma la urgencia.</p>`;
  }

  const barra = v => `<div class="barra"><i style="width:${clamp(v/maxSim*100,0,100)}%"></i></div>`;

  // Lo aprendido, en el orden en que fue pasando; lo que falta, como invitación.
  const entradas = Object.entries(CONCEPTOS);
  const aprendidos = entradas.filter(([id]) => S.conceptos[id] != null)
                             .sort((x,y) => S.conceptos[x[0]] - S.conceptos[y[0]]);
  const faltantes  = entradas.filter(([id]) => S.conceptos[id] == null);
  const nAprendidos = aprendidos.length, totalConceptos = entradas.length;
  const logrados = Object.entries(LOGROS).filter(([id]) => S.logros[id] != null);
  const aciertos = S.pronosticos.filter(x => x.acerto).length;

  /* Con qué te quedás cuando alguien te pregunta cómo te fue. */
  const vals = valores(), totalCart = totalCartera();
  const rep = {};
  Object.keys(vals).forEach(k => rep[k] = totalCart > 0 ? vals[k] / totalCart : 0);
  const arq = arquetipo({
    corte: S.finTemprano ? S.finTemprano.id : "",
    aire: a, animo: animoProm, rojo: S.mesesEnRojo, aciertos,
    conceptos: nAprendidos, total: totalCart, rep,
    reparto: Object.values(rep).filter(v => v >= .08).length,
  });
  const titular = `${S.nombre ? S.nombre + ", " : ""}${S.edad} años · ${arq.n}` +
    ` — ${aireTexto(a)} meses de aire, ${nAprendidos} de ${totalConceptos} ideas` +
    `${S.pronosticos.length ? ", " + aciertos + " de " + S.pronosticos.length + " pronósticos" : ""}.`;
  const col = sumarAColeccion();
  const totalLogros = Object.keys(LOGROS).length;
  const yaSabidos = Object.keys(col.col.conceptos).length;
  const yaLogrados = Object.keys(col.col.logros).length;

  $app.innerHTML = `<div class="fade">
    <div class="eyebrow">${(S.nombre ? S.nombre + " · " : "") + (S.finTemprano
      ? "Año " + (Math.floor(S.mes/12)+1) + " de 10 · " + S.edad + " años"
      : "Diez años después · " + S.edad + " años")}</div>
    <h1>${titulo}</h1>
    <div class="texto serif">${epilogo}</div>

    <div class="arq">
      <div class="arq-cab">Terminaste como</div>
      <div class="arq-n">${arq.n}</div>
      <div class="arq-d">${arq.d}</div>
      <button class="arq-btn" id="compartir">Copiar para compartir</button>
    </div>

    ${graficoPatrimonio()}
    <p class="graf-cap">Tu patrimonio mes a mes, en pesos de ${ANIO_INICIAL} — descontada la
      inflación. En pesos corrientes cualquier curva sube; ésta muestra si de verdad
      avanzaste. Tocala para recorrerla.</p>

    <div class="stat-grid">
      <div class="stat"><div class="n" style="color:${a<2?"var(--rojo)":a>=8?"var(--verde)":"var(--oro)"}">
        ${aireTexto(a)}</div>
        <div class="l">meses de aire<br>(cuánto aguantás sin ingresos)</div></div>
      <div class="stat"><div class="n">${usd(patrUsd)}</div>
        <div class="l">patrimonio, medido en dólares</div></div>
      <div class="stat"><div class="n">${Math.round(animoProm)}</div>
        <div class="l">ánimo promedio de la década</div></div>
      <div class="stat"><div class="n" style="color:${S.mesesEnRojo>24?"var(--rojo)":"inherit"}">
        ${S.mesesEnRojo}</div><div class="l">meses con deuda encima</div></div>
    </div>

    <hr class="sep">
    <div class="eyebrow">Con tu mismo flujo de plata</div>
    <p class="texto" style="font-size:15px; color:var(--muted); margin-bottom:12px">
      Todo lo que te sobró cada mes, si en lugar de lo que hiciste lo hubieras puesto siempre
      en el mismo lugar. Mismo sueldo, mismos gastos, mismas decisiones de vida.</p>
    <div class="card">
      <div class="comp yo"><span class="nom">Lo que hiciste vos</span>${barra(patrUsd)}
        <span class="val">${usd(patrUsd)}</span></div>
      <div class="comp"><span class="nom">Todo en pesos, quieto</span>${barra(simPesosUsd)}
        <span class="val">${usd(simPesosUsd)}</span></div>
      <div class="comp"><span class="nom">Todo a plazo fijo</span>${barra(simPlazoUsd)}
        <span class="val">${usd(simPlazoUsd)}</span></div>
      <div class="comp"><span class="nom">Todo a dólares</span>${barra(simUsdUsd)}
        <span class="val">${usd(simUsdUsd)}</span></div>
      <div class="comp"><span class="nom">Todo al índice global</span>${barra(simIndiceUsd)}
        <span class="val">${usd(simIndiceUsd)}</span></div>
      <div class="comp"><span class="nom">Todo al bono del país</span>${barra(simBonoUsd)}
        <span class="val">${usd(simBonoUsd)}</span></div>
    </div>
    <p class="nota">Te tocó un país con estos regímenes: la inflación acumulada de la década fue
      ${pct(S.ipc - 1)}, el dólar pasó de $1.350 a ${fmt(S.dolar)}, hubo ${S.elecciones}
      ${S.elecciones === 1 ? "elección" : "elecciones"} y el índice global multiplicó por
      ${(S.indicePrecio/100).toFixed(2).replace(".",",")}. En otra partida te toca otro
      país. Esa es la idea: si hubiera una jugada que gana siempre, no habría nada que aprender.</p>

    ${S.pronosticos.length >= 2 ? `
    <hr class="sep">
    <div class="eyebrow">Tus pronósticos · ${aciertos} de ${S.pronosticos.length}</div>
    <p class="texto" style="font-size:15px; color:var(--muted); margin-bottom:12px">
      Cada año arriesgaste qué iba a rendir más. ${
        aciertos / S.pronosticos.length >= .5
          ? "Le pegaste más de la mitad de las veces. Con cuatro o cinco opciones, tirando una moneda se acierta bastante menos — pero tampoco alcanza para creerte que la ves venir: diez tiros son muy pocos para distinguir el ojo de la suerte."
          : "Como casi todo el mundo. No es que hayas elegido mal: es que no se puede. Por eso la respuesta no es acertar, es estar parado de una forma que aguante cualquiera de los resultados."}</p>
    <div class="card tenue">
      ${S.pronosticos.map(pr => `<div class="mes-linea">
        <span>Año ${Math.floor(pr.mes/12)}</span>
        <span style="text-align:right; color:var(--text)">
          dijiste ${nombreRubro(pr.elegido)} · fue ${nombreRubro(pr.gano)}
          <b style="color:${pr.acerto ? "var(--verde)" : "var(--rojo)"}">${pr.acerto ? "✓" : "✗"}</b>
        </span></div>`).join("")}
    </div>` : ""}

    <hr class="sep">
    <div class="eyebrow">Lo que aprendiste · ${nAprendidos} de ${totalConceptos}</div>
    <p class="texto" style="font-size:15px; color:var(--muted); margin-bottom:12px">
      Cada idea se desbloqueó el mes que te pasó. Las que te faltan no están escondidas:
      aparecen si tomás otras decisiones.</p>
    ${aprendidos.map(([id,c]) => `<div class="card concepto">
        <div class="concepto-n">${c.n}${col.nuevosC.has(id) ? '<span class="nuevo">nuevo</span>' : ""}</div>
        <div class="concepto-t">${c.t}</div></div>`).join("")}
    ${faltantes.length ? `<div class="card tenue">
        <div class="eyebrow gris">Todavía no te pasaron</div>
        <div class="pendientes">${faltantes.map(([id,c]) =>
          `<span class="pendiente">${c.n}</span>`).join("")}</div></div>` : ""}

    <hr class="sep">
    <div class="eyebrow">Logros · ${logrados.length} de ${Object.keys(LOGROS).length}</div>
    <div class="card">
      ${logrados.length
        ? logrados.map(([id,l]) => `<div class="logro"><span class="logro-tic">◆</span>
            <span><b>${l.n}</b>${col.nuevosL.has(id) ? '<span class="nuevo">nuevo</span>' : ""}
            <span class="logro-d">${l.d}</span></span></div>`).join("")
        : `<p class="texto" style="font-size:15px; color:var(--muted); margin:0">
             Ninguno esta vez. Están puestos en las cosas difíciles de sostener diez años.</p>`}
    </div>

    <hr class="sep">
    <div class="eyebrow gris">Tu década</div>
    <div class="card tenue">
      ${S.historia.map(h => `<div class="mes-linea"><span>Año ${Math.floor(h.mes/12)+1}</span>
        <span style="text-align:right; color:var(--text)">${h.t}</span></div>`).join("")}
      ${S.golpes || S.suertes ? `<div class="mes-linea" style="margin-top:8px">
        <span>El azar</span><span style="text-align:right; color:var(--text)">
        ${S.golpes} ${S.golpes === 1 ? "golpe" : "golpes"} y
        ${S.suertes} ${S.suertes === 1 ? "guiñada" : "guiñadas"}</span></div>` : ""}
    </div>

    <hr class="sep">
    <div class="card tenue">
      <div class="eyebrow gris">En todas tus partidas</div>
      <div class="mes-linea"><span>Vidas jugadas</span>
        <span style="color:var(--text)">${col.col.partidas}</span></div>
      <div class="mes-linea"><span>Ideas que ya conocés</span>
        <span style="color:var(--text)">${yaSabidos} de ${totalConceptos}</span></div>
      <div class="mes-linea"><span>Logros conseguidos</span>
        <span style="color:var(--text)">${yaLogrados} de ${totalLogros}</span></div>
      <div class="mes-linea"><span>Tu mejor aire</span>
        <span style="color:var(--text)">${aireTexto(col.col.mejorAire)} meses</span></div>
      ${yaSabidos < totalConceptos ? `<div class="aviso" style="margin-top:12px">Te faltan
        ${totalConceptos - yaSabidos} ideas. No están escondidas: aparecen si tomás otras
        decisiones.</div>` : `<div class="aviso" style="margin-top:12px">Las viste todas.
        Ahora la pregunta es si podés sostenerlo, no si lo entendés.</div>`}
    </div>

    <button class="btn" id="otra" style="margin-top:20px">Jugar otra vida</button>
    <p class="nota">Esto es un juego. Los números son verosímiles, no son un pronóstico,
      y nada de acá es asesoramiento financiero.</p>
  </div>`;
  borrarGuardado();
  activarGrafico();
  const $comp = document.getElementById("compartir");
  if($comp) $comp.onclick = async () => {
    const linea = titular + " · Fin de Mes";
    let ok = false;
    try { await navigator.clipboard.writeText(linea); ok = true; }
    catch(e){
      /* En un iframe sin permiso de portapapeles la API tira. El textarea
         temporal con execCommand sigue andando en ese caso. */
      try {
        const t = document.createElement("textarea");
        t.value = linea; t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select();
        ok = document.execCommand("copy");
        document.body.removeChild(t);
      } catch(e2){}
    }
    $comp.textContent = ok ? "Copiado" : linea;
    $comp.classList.add("listo");
  };
  document.getElementById("otra").onclick = pantallaInicio;
}

/* ==========================================================================
   INICIO
   ========================================================================== */
let eleccionInicio = {};

function pantallaInicio(){
  S = null; pendientes = []; eleccionInicio = {}; pintarHud();
  const guardada = hayGuardado();
  const col = leerColeccion();
  const combos = Object.keys(col.combos || {}).length;
  const totalCombos = VIVIENDAS.length * TRABAJOS.length;

  $app.innerHTML = `<div class="fade" style="padding-top:44px">
    <div class="eyebrow">Un juego de decisiones</div>
    <h1 class="serif">Fin de Mes</h1>
    <div class="texto serif" style="margin-bottom:26px">
      <p>Tenés veintidós años y diez años por delante: sueldos que llegan tarde, precios que
      llegan temprano, y un montón de decisiones chicas que de a una no parecen nada.</p>
      <p><em>No hay respuestas correctas. Hay consecuencias.</em></p>
    </div>
    <!-- Sin esto, nadie sabe qué está tratando de lograr. Un jugador de verdad
         lo dijo antes que ningún test: entendía las escenas y no el juego. -->
    <div class="comovaeso">
      <div class="cv-t">Cómo se gana</div>
      <p>Se juegan <b>diez años, mes a mes</b>. En cada uno pasa algo y elegís qué hacer.</p>
      <p>El puntaje no es cuánta plata juntaste: es el <b class="cv-aire">aire</b> — cuántos
      meses podrías vivir si mañana se corta el ingreso. Empezás con menos de uno.</p>
      <p>Y hay una segunda cuenta que también se cobra: el <b class="cv-animo">ánimo</b>. Si
      juntás plata y no vivís nada, la década se termina antes.</p>
      <p class="cv-fin">Una partida lleva unos 25 minutos. Podés cerrar cuando quieras y
      sigue donde ibas.</p>
    </div>
    <div class="eyebrow gris">¿Cómo te llamás?</div>
    <input type="text" id="nombre" class="campo" maxlength="18" autocomplete="off"
           placeholder="Tu nombre" value="${(col.nombre || "").replace(/"/g, "&quot;")}">
    <button class="btn" id="empezar" style="margin-top:14px">Empezar</button>
    ${guardada ? `<button class="btn ghost" id="seguirPartida" style="margin-top:10px">Seguir la partida anterior</button>` : ""}
    ${col.partidas ? `<p class="nota">Llevás ${col.partidas}
      ${col.partidas === 1 ? "vida jugada" : "vidas jugadas"} y probaste ${combos} de
      ${totalCombos} maneras de arrancar.</p>` : ""}
    <p class="nota">Los precios, los sueldos y la inflación son inventados pero verosímiles.
      El país que te toca se sortea al empezar y cambia sin avisar, como el de verdad.</p>
  </div>`;

  const $n = document.getElementById("nombre");
  const arrancar = () => {
    const nombre = ($n.value || "").trim().slice(0, 18);
    const c = leerColeccion(); c.nombre = nombre; guardarColeccion(c);
    eleccionInicio.nombre = nombre;
    pantallaVivienda();
  };
  document.getElementById("empezar").onclick = arrancar;
  $n.addEventListener("keydown", ev => { if(ev.key === "Enter") arrancar(); });
  $n.focus();
  const sp = document.getElementById("seguirPartida");
  if(sp) sp.onclick = () => { if(cargar()) siguiente(); };
}

function pantallaVivienda(){
  pintarHud();
  $app.innerHTML = `<div class="fade" style="padding-top:32px">
    <div class="eyebrow">Primero de dos</div>
    <h2>${eleccionInicio.nombre ? eleccionInicio.nombre + ", ¿dónde vivís?" : "¿Dónde vivís?"}</h2>
    <p class="texto" style="font-size:15px; color:var(--muted); margin:0 0 18px">
      Define cuánto de lo que entra se te va antes de decidir nada.</p>
    <div class="ops">
      ${VIVIENDAS.map((o,i) => `<button class="op" data-i="${i}">${o.titulo} ${puntos(o.dif)}
        <span class="sub">${o.sub}</span></button>`).join("")}
    </div></div>`;
  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => { eleccionInicio.viv = VIVIENDAS[+b.dataset.i]; pantallaTrabajo(); };
  });
}

function pantallaTrabajo(){
  pintarHud();
  $app.innerHTML = `<div class="fade" style="padding-top:32px">
    <div class="eyebrow">Segundo de dos</div>
    <h2>¿De qué laburás?</h2>
    <p class="texto" style="font-size:15px; color:var(--muted); margin:0 0 18px">

    <div class="ops">
      ${TRABAJOS.map((o,i) => `<button class="op" data-i="${i}">${o.titulo} ${puntos(o.dif)}

    </div>
    <button class="btn ghost" id="volver" style="margin-top:14px">Volver</button></div>`;
  $app.querySelectorAll(".op").forEach(b => {
    b.onclick = () => {
      const tra = TRABAJOS[+b.dataset.i];
      nuevaPartida(armarArranque(eleccionInicio.viv, tra));
      S.nombre = eleccionInicio.nombre || "";
      const c = leerColeccion();
      c.combos = c.combos || {};
      c.combos[eleccionInicio.viv.id + "/" + tra.id] = true;
      guardarColeccion(c);
      siguiente();
    };
  });
  document.getElementById("volver").onclick = pantallaVivienda;
}

/* ---------- colección entre partidas ----------
   Los conceptos y logros se perdían al empezar otra vida, así que no había
   ninguna razón para volver a jugar más allá de la curiosidad. Esto se acumula:
   lo que aprendiste una vez ya lo sabés. */
const CLAVE_COL = "finDeMes.coleccion.v1";
function leerColeccion(){
  try{ return Object.assign({ conceptos:{}, logros:{}, partidas:0, mejorAire:0 },
                            JSON.parse(localStorage.getItem(CLAVE_COL)) || {}); }
  catch(e){ return { conceptos:{}, logros:{}, partidas:0, mejorAire:0 }; }
}
function guardarColeccion(c){
  try{ localStorage.setItem(CLAVE_COL, JSON.stringify(c)); }catch(e){}
}
/* Suma la partida que termina y devuelve qué fue novedad esta vez. */
function sumarAColeccion(){
  const c = leerColeccion();
  const nuevosC = Object.keys(S.conceptos).filter(k => !c.conceptos[k]);
  const nuevosL = Object.keys(S.logros).filter(k => !c.logros[k]);
  Object.keys(S.conceptos).forEach(k => c.conceptos[k] = true);
  Object.keys(S.logros).forEach(k => c.logros[k] = true);
  c.partidas++;
  c.mejorAire = Math.max(c.mejorAire || 0, aire());
  guardarColeccion(c);
  return { nuevosC: new Set(nuevosC), nuevosL: new Set(nuevosL), col: c };
}

/* ---------- persistencia ----------
   Safari en modo privado y algunos iframes tiran excepción al tocar localStorage.
   Si pasa, el juego tiene que seguir andando: se pierde el guardado, nada más. */
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
function hayGuardado(){ try{ return !!localStorage.getItem(CLAVE); }catch(e){ return false; } }
function borrarGuardado(){ try{ localStorage.removeItem(CLAVE); }catch(e){} }
function cargar(){
  try{ const r = localStorage.getItem(CLAVE); if(!r) return false; S = JSON.parse(r); return true; }
  catch(e){ return false; }
}

pantallaInicio();
